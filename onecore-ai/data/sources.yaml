    enabled: true
  - id: fineweb2_full_es
    repo: HuggingFaceFW/fineweb-2
    config: spa_Latn
    hf_splits: [train]
    adapter: text
    text_fields: [text]
    split_strategy: hash
    crawler: hf_state_dict
    notebook_id: 03_text_pretraining
    limits: {train: 5000, validation: 250, test: 250}
    profile_limits:
      expanded: {train: 50000, validation: 2500, test: 2500}
