  - id: fineweb2_full_pt
    repo: HuggingFaceFW/fineweb-2
    config: por_Latn
    hf_splits: [train]
    adapter: text
    text_fields: [text]
    split_strategy: hash
    crawler: hf_state_dict
    notebook_id: 03_text_pretraining
    limits: {train: 5000, validation: 250, test: 250}
    profile_limits:
      expanded: {train: 50000, validation: 2500, test: 2500}
    enabled: true
  - id: fineweb2_full_id
    repo: HuggingFaceFW/fineweb-2
    config: ind_Latn
    hf_splits: [train]
    adapter: text
    text_fields: [text]
    split_strategy: hash
    crawler: hf_state_dict
    notebook_id: 03_text_pretraining
    limits: {train: 5000, validation: 250, test: 250}
    profile_limits:
      expanded: {train: 50000, validation: 2500, test: 2500}
    enabled: true
  - id: fineweb2_full_ja
    repo: HuggingFaceFW/fineweb-2
    config: jpn_Jpan
    hf_splits: [train]
    adapter: text
    text_fields: [text]
    split_strategy: hash
    crawler: hf_state_dict
    notebook_id: 03_text_pretraining
    limits: {train: 5000, validation: 250, test: 250}
    profile_limits:
      expanded: {train: 50000, validation: 2500, test: 2500}
    enabled: true
  - id: fineweb2_full_ru
    repo: HuggingFaceFW/fineweb-2
    config: rus_Cyrl
    hf_splits: [train]
    adapter: text
    text_fields: [text]
    split_strategy: hash
    crawler: hf_state_dict
    notebook_id: 03_text_pretraining
    limits: {train: 5000, validation: 250, test: 250}
    profile_limits:
      expanded: {train: 50000, validation: 2500, test: 2500}
    enabled: true
  - id: stack_v2_code
    repo: bigcode/the-stack-v2
    hf_splits: [train]
    adapter: stack_v2_code
    split_strategy: hash
    split_group_field: directory_id
    crawler: hf_state_dict_plus_swh_content
    notebook_id: 03_text_pretraining
    requires_access: true
    # Keep the gated code corpus enabled, but do not block the first joint run
    # while HF/SWH approvals are pending. Only verified file payloads count.
    required_for_training: false
    minimum_accepted_records: 10000
    limits: {train: 10000, validation: 500, test: 500}
    profile_limits:
      expanded: {train: 200000, validation: 5000, test: 5000}
    max_content_bytes: 524288
    max_record_chars: 8192
    allowed_languages:
      - Python
      - JavaScript
      - TypeScript
      - Java
      - C
      - C++
      - C#
      - C-Sharp
      - Go
      - Rust
      - SQL
      - Shell
      - Bash
      - HTML
      - CSS
      - PHP
      - Ruby
      - Kotlin
      - Swift
      - Dart
      - Scala
      - R
      - Julia
      - Lua
      - Markdown
    license_allowlist:
      - 0BSD
      - Apache-2.0
      - BSD-2-Clause
      - BSD-3-Clause
      - CC0-1.0
      - ISC
      - MIT
      - Unlicense
      - Zlib
    enabled: true

  - id: fineweb2_full_en
    repo: HuggingFaceFW/fineweb-2
