version: 1
description: "Unified multimodal OneCore source registry; all records feed one shared checkpoint."
profile: initial
defaults:
  split_seed: "onecore-shard-v1"
  max_scan_multiplier: 12
  image_size: 64
  max_video_frames: 4
sources:
  # Broad general-language pretraining
  - id: fineweb2_hq_ar
    repo: epfml/FineWeb2-HQ-Plus
    config: arb_Arab
    hf_splits: [train]
    adapter: text
    text_fields: [text]
    split_strategy: hash
    limits: {train: 2000, validation: 100, test: 100}
    profile_limits:
      expanded: {train: 12000, validation: 400, test: 400}
    enabled: true
  - id: fineweb2_hq_en
    repo: epfml/FineWeb2-HQ-Plus
    config: eng_Latn
    hf_splits: [train]
    adapter: text
    text_fields: [text]
    split_strategy: hash
    limits: {train: 1500, validation: 75, test: 75}
    profile_limits:
      expanded: {train: 9000, validation: 300, test: 300}
    enabled: false  # English config is not published by this repo; avoid repeatable source failure
  - id: fineweb2_hq_ar_saudi
    repo: epfml/FineWeb2-HQ-Plus
    config: ars_Arab
    hf_splits: [train]
    adapter: text
    text_fields: [text]
    split_strategy: hash
    limits: {train: 400, validation: 25, test: 25}
    profile_limits:
      expanded: {train: 2400, validation: 100, test: 100}
    enabled: true
  - id: fineweb2_hq_ar_moroccan
    repo: epfml/FineWeb2-HQ-Plus
    config: ary_Arab
    hf_splits: [train]
    adapter: text
    text_fields: [text]
    split_strategy: hash
    limits: {train: 600, validation: 30, test: 30}
    profile_limits:
      expanded: {train: 3600, validation: 150, test: 150}
    enabled: true
  - id: fineweb2_hq_ar_egyptian
    repo: epfml/FineWeb2-HQ-Plus
    config: arz_Arab
    hf_splits: [train]
    adapter: text
    text_fields: [text]
    split_strategy: hash
    limits: {train: 500, validation: 25, test: 25}
    profile_limits:
      expanded: {train: 3000, validation: 120, test: 120}
    enabled: true
  - id: fineweb2_full_ar
    repo: HuggingFaceFW/fineweb-2
    config: arb_Arab
    hf_splits: [train]
    adapter: text
    text_fields: [text]
    split_strategy: hash
    crawler: hf_state_dict
    notebook_id: 03_text_pretraining
    required_for_training: true
    minimum_accepted_records: 10000
    limits: {train: 20000, validation: 1000, test: 1000}
    profile_limits:
      expanded: {train: 250000, validation: 10000, test: 10000}
    enabled: true
  - id: fineweb2_full_ar_egyptian
    repo: HuggingFaceFW/fineweb-2
    config: arz_Arab
    hf_splits: [train]
    adapter: text
    text_fields: [text]
    split_strategy: hash
    crawler: hf_state_dict
    notebook_id: 03_text_pretraining
    limits: {train: 10000, validation: 500, test: 500}
    profile_limits:
      expanded: {train: 100000, validation: 5000, test: 5000}
    enabled: true
  - id: fineweb2_full_ar_saudi
    repo: HuggingFaceFW/fineweb-2
    config: ars_Arab
    hf_splits: [train]
    adapter: text
    text_fields: [text]
    split_strategy: hash
    crawler: hf_state_dict
    notebook_id: 03_text_pretraining
    limits: {train: 10000, validation: 500, test: 500}
    profile_limits:
      expanded: {train: 100000, validation: 5000, test: 5000}
    enabled: true
  - id: fineweb2_full_ar_moroccan
    repo: HuggingFaceFW/fineweb-2
    config: ary_Arab
    hf_splits: [train]
    adapter: text
    text_fields: [text]
    split_strategy: hash
    crawler: hf_state_dict
    notebook_id: 03_text_pretraining
    limits: {train: 10000, validation: 500, test: 500}
    profile_limits:
      expanded: {train: 100000, validation: 5000, test: 5000}
    enabled: true
  - id: fineweb2_full_ar_iraqi
    repo: HuggingFaceFW/fineweb-2
    config: acm_Arab
    hf_splits: [train]
    adapter: text
    text_fields: [text]
    split_strategy: hash
    crawler: hf_state_dict
    notebook_id: 03_text_pretraining
    limits: {train: 8000, validation: 400, test: 400}
    profile_limits:
      expanded: {train: 80000, validation: 4000, test: 4000}
    enabled: true
  - id: fineweb2_full_ar_algerian
    repo: HuggingFaceFW/fineweb-2
    config: arq_Arab
    hf_splits: [train]
    adapter: text
    text_fields: [text]
    split_strategy: hash
    crawler: hf_state_dict
    notebook_id: 03_text_pretraining
    limits: {train: 8000, validation: 400, test: 400}
    profile_limits:
      expanded: {train: 80000, validation: 4000, test: 4000}
    enabled: true
  # FineWeb-2 has no eng_Latn shard; use verified multilingual shards rather than a broken English config.
  - id: fineweb2_full_tr
