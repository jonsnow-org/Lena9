    split_strategy: hash
    limits: {train: 1000, validation: 30, test: 30}
    enabled: true
  - id: stack_v2_edu
    repo: common-pile/stackv2_edu_filtered
    config: default
    hf_splits: [train]
    adapter: text
    text_fields: [text]
    split_strategy: hash
    limits: {train: 500, validation: 25, test: 25}
    profile_limits:
      expanded: {train: 1800, validation: 40, test: 40}
    enabled: true

  # Speech, sound and audio-language
  - id: saxo_function_calling
    repo: Saxo/alpaca_function_calling_dataset
    config: default
    hf_splits: [train]
    adapter: tool_use
    system_fields: [system]
    text_fields: [instruction]
    response_fields: [output]
    split_strategy: hash
    limits: {train: 9000, validation: 250, test: 250}
    enabled: true
  - id: turkish_mobile_function_calling
    repo: BTX24/turkish-mobile-function-calling-dataset
    config: default
    hf_splits: [train]
    adapter: tool_use
    text_fields: [user_content]
    tool_name_field: tool_name
    tool_arguments_field: tool_arguments
    split_strategy: hash
    limits: {train: 5000, validation: 150, test: 150}
    enabled: true
  - id: fleurs_ar
    repo: google/fleurs
    config: ar_eg
