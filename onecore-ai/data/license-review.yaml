version: 1
description: >-
  Source-specific licensing evidence for OneCore. Empty by default: absence of a
  review is not permission. Do not copy a repository's license label into this
  file without reading authoritative dataset/source terms and reviewing
  model-training, commercial deployment, attribution, redistribution and
  share-alike obligations.
policy:
  unknown_means_not_cleared: true
  require_authoritative_https_evidence: true
  require_evidence_sha256: true
  require_human_reviewer: true
  require_model_training_use: true
  require_commercial_deployment_use: true
sources: {}
