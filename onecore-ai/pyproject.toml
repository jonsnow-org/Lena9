[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "onecore-ai"
version = "0.1.0"
description = "From-scratch compact unified multimodal foundation-model research"
requires-python = ">=3.11"
dependencies = [
  "torch>=2.3,<3",
  "numpy>=1.26,<3",
  "Pillow>=10,<13",
  "tokenizers>=0.19,<1",
  "PyYAML>=6,<7",
  "datasets>=3.2,<5",
  "huggingface_hub>=0.27,<2",
  "boto3>=1.34,<2",
  "imageio>=2.34,<3",
  "imageio-ffmpeg>=0.5,<1",
  "soundfile>=0.12,<1",
  "scipy>=1.11,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "nbformat>=5.10,<6", "nbclient>=0.10,<1", "jupyter>=1,<2"]
corpus-restore = [
  "requests>=2.31,<3",
  "remotezip>=0.12,<1",
]

[project.scripts]
onecore = "onecore.cli:main"
onecore-v3-convert = "onecore.v3.cli:main"
onecore-v3-tokenizer = "onecore.v3.tokenizer:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
