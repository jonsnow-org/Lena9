[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "onecore-ai"
version = "0.1.0"
description = "From-scratch compact unified multimodal foundation-model research"
requires-python = ">=3.11"
dependencies = [
  "torch>=2.3,<3",
  "numpy>=1.26,<3",
  "Pillow>=10,<13",
  "tokenizers>=0.19,<1",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "nbformat>=5.10,<6", "nbclient>=0.10,<1", "jupyter>=1,<2"]

[project.scripts]
onecore = "onecore.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
