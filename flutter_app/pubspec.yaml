name: literium_app
description: >
  تطبيق Literium الأصيل (Flutter/Android) — يتصل بنفس مشروع Firebase
  (Auth + Firestore) الذي يستخدمه موقع literium.ai.studio، ويعيد استخدام
  نفس واجهات server.ts البرمجية (REST) للعمليات المالية بدل بناء خادم جديد.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ---- Firebase: نفس مشروع "literium" المستخدم في الموقع تماماً ----
  # مثبَّتة على إصدارات حديثة (بدل ٣.x/٥.x الأصلية) لأن flutter create يولّد
  # مشروع Gradle حديثاً (Kotlin DSL + AGP جديد) لا تتوافق معه الإصدارات
  # القديمة من حزم Firebase/Google — ظهر هذا فعلياً عبر فشل بناء حقيقي.
  firebase_core: ^4.14.0
  firebase_auth: ^6.6.0
  cloud_firestore: ^6.9.0
  # يلتقط الأعطال الأصلية (native) عند الإقلاع — ضروري للتشخيص لأن المستخدم
  # لا يملك حاسوباً/ADB لقراءة سجل عطل مباشرة من الجهاز.
  firebase_crashlytics: ^5.3.0
  # يبقى على خط v6 عمداً — v7 غيّر الواجهة البرمجية جذرياً (GoogleSignIn()
  # أُزيل لصالح GoogleSignIn.instance + initialize()/authenticate() غير
  # المتزامنة)، وتبنّيه الآن يعني إعادة كتابة auth_service.dart دون أي مصحّح
  # Dart متاح هنا للتحقق — مخاطرة غير ضرورية بينما v6 لم يفشل أصلاً.
  google_sign_in: ^6.3.0

  # ---- إعلانات AdMob ---- (5.2.0 القديم غير متوافق مع Gradle الحديث)
  google_mobile_ads: ^9.1.0

  # ---- استدعاء endpoint فتح المقال المقفول الموجود فعلاً في server.ts ----
  http: ^1.2.2

  # ---- إدارة الحالة ----
  provider: ^6.1.2

  # ---- عرض الصور من Cloudinary (نفس مصدر صور المقالات في الموقع) ----
  cached_network_image: ^3.4.1

  # ---- عرض محتوى HTML الغني لجسم المقال (content مخزّن HTML من المحرر) ----
  # ⚠️ تثبيت دقيق بلا "^" عمداً — لا يوجد pubspec.lock مرفوع في المستودع
  # (كل تشغيل CI يحلّل الاعتماديات من جديد)، والقيد بعلامة "^" كان يسمح
  # لـ pub باختيار الإصدار الثابت 3.0.0 (أحدث من 3.0.0-beta.2 بترتيب
  # semver رغم كونه "قبل" اسمياً) بدل النسخة التجريبية المُثبَّتة فعلياً —
  # وهذا الإصدار الثابت 3.0.0 يستدعي داخلياً qs.matches(...) من اعتمادية
  # غير متوافقة معه (خطأ بناء حقيقي: "Method not found: 'matches'"،
  # flutter_html-3.0.0/lib/src/tree/styled_element.dart:31). 3.0.0-beta.2
  # لا يعتمد على حزمة qs إطلاقاً (فحص فعلي لقائمة اعتمادياته على pub.dev)،
  # وهو ما نجحت به كل عمليات البناء السابقة الفعلية — التثبيت الدقيق هنا
  # يمنع pub من "الترقية" التلقائية لإصدار مكسور لاحقاً بصمت مجدداً.
  flutter_html: 3.0.0-beta.2

  # ---- اختيار صورة وثيقة KYC من المعرض أو الكاميرا ----
  # تثبيت دقيق بلا "^" لنفس السبب أعلاه (لا يوجد pubspec.lock مرفوع) —
  # 1.2.3 تأكدنا أنه الإصدار المستقر الفعلي الحالي على pub.dev (ناشر
  # Flutter الموثَّق) بدل الاعتماد على استنتاج.
  image_picker: 1.2.3

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
