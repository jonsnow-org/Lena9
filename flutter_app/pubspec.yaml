name: literium_app
description: >
  غلاف WebView أصيل (Flutter/Android) حول موقع literium.ai.studio الحي —
  يعرض نفس الموقع بالضبط بلا أي إعادة بناء لواجهته: نفس المحتوى، نفس
  الترتيب، نفس الشكل، لأنه هو نفس الموقع فعلياً وليس نسخة منفصلة منه.
  (كانت نسخة سابقة من هذا المشروع تعيد بناء شاشات Dart مستقلة تحاكي
  الموقع — استُبدلت بالكامل بهذا الغلاف لأن أي إعادة بناء منفصلة تنحرف
  حتماً عن الموقع الحقيقي في المحتوى والترتيب والشكل.)
publish_to: 'none'
version: 0.2.0+2

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ---- عرض الموقع الحي نفسه ----
  webview_flutter: ^4.10.0
  # مطلوبة صراحة للوصول إلى AndroidWebViewController.setOnShowFileSelector
  # (اختيار ملف حقيقي من الجهاز عند لمس <input type="file"> في الموقع —
  # رفع صورة مقال/رسالة/وثيقة KYC — بلا هذا لا يفتح أي منتقي ملفات إطلاقاً
  # على Android عند لمس هذه الحقول).
  webview_flutter_android: ^4.3.5
  # منتقي ملفات حقيقي من الجهاز (معرض/كاميرا/مستندات) يُستدعى من نفس الرد
  # أعلاه — يعتمد على منتقي النظام (Storage Access Framework) فلا يحتاج
  # أي إذن تخزين صريح في AndroidManifest.
  # ⚠️ ^8.x يُحلَّل إلى 8.3.7 — مبني بـcompileSdk 34، بينما
  # flutter_plugin_android_lifecycle (تبعية ضمنية من Flutter نفسه) يتطلب
  # الآن compileSdk 36+ ممن يعتمد عليه. هذا فشل بناء حقيقي فعلياً
  # ("checkReleaseAarMetadata")، وليس تخميناً — إصدار أحدث (12.x، مبني
  # بـcompileSdk أحدث) هو الحل.
  file_picker: ^12.1.2
  # فتح الروابط الخارجية (mailto:, tel:, روابط تخرج عن نطاق الموقع نفسه)
  # في المتصفح/التطبيق المناسب خارج الـWebView بدل محاولة تحميلها داخله.
  url_launcher: ^6.3.1

  # ---- يلتقط الأعطال الأصلية (native) عند الإقلاع — ضروري للتشخيص لأن
  # المستخدم لا يملك حاسوباً/ADB لقراءة سجل عطل مباشرة من الجهاز ----
  firebase_core: ^4.14.0
  firebase_crashlytics: ^5.3.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
