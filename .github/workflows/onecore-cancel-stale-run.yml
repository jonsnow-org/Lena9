name: OneCore cancel one stale corpus restore

on:
  push:
    branches: [research/onecore-foundation]
    paths:
      - ".github/workflows/onecore-cancel-stale-run.yml"

permissions:
  actions: write

jobs:
  cancel_stale_restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Cancel only the superseded pre-decoder-fix run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_RUN_ID: "44456885046"
        run: |
          set -euo pipefail
          state=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${TARGET_RUN_ID}" --jq '.status + "/" + (.conclusion // "")')
          echo "Target OneCore run ${TARGET_RUN_ID}: ${state}"
          if [[ "${state}" == "in_progress/" || "${state}" == "queued/" || "${state}" == "pending/" ]]; then
            gh api --method POST "/repos/${GITHUB_REPOSITORY}/actions/runs/${TARGET_RUN_ID}/cancel"
            echo "Cancellation requested for superseded run ${TARGET_RUN_ID}."
          else
            echo "Target run is already terminal; no cancellation needed."
          fi
