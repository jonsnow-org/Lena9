name: Keep Render Service Awake

# ⚠️ موقوف تلقائياً: ساعات Render المجانية (750 ساعة/شهر) مشتركة بين كل
# خدمات الحساب، وإبقاء ليتيريوم مستيقظاً باستمرار كان يستنزفها ويؤدي لتعليق
# الخدمات. الخدمة الآن تنام بعد 15 دقيقة خمول وتستيقظ عند أول زيارة حقيقية،
# والسيرات الدورية الأخرى مجمّعة في نافذتين يومياً (07:00 و17:00 UTC).
#
# بقي هذا السير للتشغيل اليدوي فقط (Run workflow): يبقي الخدمة مستيقظة مدة
# محددة بالدقائق ثم يتوقف، بلا أي إعادة تشغيل ذاتية.

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: 'مدة الإبقاء مستيقظاً بالدقائق (حد أقصى 350)'
        required: false
        default: '60'

permissions:
  contents: read

concurrency:
  group: keep-render-awake
  cancel-in-progress: true

jobs:
  keep-awake:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Ping /api/health every 4 minutes for the requested duration
        env:
          MINUTES: ${{ github.event.inputs.minutes }}
        run: |
          mins=${MINUTES:-60}
          case "$mins" in ''|*[!0-9]*) mins=60 ;; esac
          [ "$mins" -gt 350 ] && mins=350
          end=$(( $(date -u +%s) + mins * 60 ))
          while [ "$(date -u +%s)" -lt "$end" ]; do
            status=$(curl -sS -m 20 -o /dev/null -w "%{http_code}" https://literium-wjct.onrender.com/api/health || echo "000")
            echo "$(date -u '+%Y-%m-%d %H:%M:%S') UTC — ping status: $status"
            sleep 240
          done
