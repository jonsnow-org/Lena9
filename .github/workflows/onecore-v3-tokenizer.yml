name: OneCore — adopt the pinned 32K external train-only tokenizer

on:
  push:
    branches: [research/onecore-v3-implementation]
    paths:
      - "onecore-ai/v3-tokenizer-request.json"
      - "onecore-ai/src/onecore/v3/tokenizer.py"
      - "onecore-ai/src/onecore/v3/config.py"
      - "onecore-ai/configs/onecore-v3-research.yaml"
      - ".github/workflows/onecore-v3-tokenizer.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: onecore-canonical-tokenizer-32000
  cancel-in-progress: false

jobs:
  adopt_external_train_tokenizer:
    name: Verify and re-attest the immutable 32K tokenizer (no refit)
    if: github.ref == 'refs/heads/research/onecore-v3-implementation'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONPATH: onecore-ai/src
      GH_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
    steps:
      - name: Checkout the single canonical OneCore branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install tokenizer verifier dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "tokenizers>=0.19,<1" "PyYAML>=6,<7"
      - name: Download, verify and re-attest the immutable historical tokenizer
        run: |
          python - <<'PY'
          import hashlib, io, json, os, zipfile
          from pathlib import Path
          from urllib.request import Request, urlopen
          import yaml
          from onecore.v3.config import V3Config
          from onecore.v3.tokenizer import adopt_v3_tokenizer, verify_v3_tokenizer
          req = json.loads(Path("onecore-ai/v3-tokenizer-request.json").read_text(encoding="utf-8"))
          headers = {"Authorization": f"Bearer {os.environ['GH_TOKEN']}", "Accept": "application/vnd.github+json"}
          api = f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}"
          def get(path):
              with urlopen(Request(api + path, headers=headers), timeout=45) as response:
                  return json.loads(response.read().decode("utf-8"))
          run = get(f"/actions/runs/{req['source_run_id']}")
          expected_run = {"id": req["source_run_id"], "head_branch": "research/onecore-v3-implementation",
              "head_sha": req["source_run_sha"], "path": ".github/workflows/onecore-v3-tokenizer.yml",
              "event": "push", "status": "completed", "conclusion": "success"}
          if {key: run.get(key) for key in expected_run} != expected_run:
              raise SystemExit("historical tokenizer run metadata mismatch")
          artifacts = get(f"/actions/runs/{req['source_run_id']}/artifacts?per_page=100").get("artifacts", [])
          matches = [a for a in artifacts if int(a.get("id", 0)) == req["source_artifact_id"]]
          if len(matches) != 1:
              raise SystemExit("pinned historical tokenizer artifact missing or ambiguous")
          artifact = matches[0]
          expected = {"name": req["source_artifact_name"], "digest": req["source_artifact_digest"],
              "size_in_bytes": req["source_artifact_size_bytes"], "expired": False}
          actual = {"name": artifact.get("name"), "digest": artifact.get("digest"),
              "size_in_bytes": int(artifact.get("size_in_bytes", 0)), "expired": artifact.get("expired")}
          if actual != expected:
              raise SystemExit(f"historical tokenizer artifact metadata mismatch: {actual}")
          with urlopen(Request(api + f"/actions/artifacts/{req['source_artifact_id']}/zip", headers=headers), timeout=180) as response:
              archive_bytes = response.read()
          archive_sha = hashlib.sha256(archive_bytes).hexdigest()
          if len(archive_bytes) != req["source_artifact_size_bytes"] or "sha256:" + archive_sha != req["source_artifact_digest"]:
              raise SystemExit("historical tokenizer archive bytes/digest mismatch")
          wanted = {req["source_tokenizer_file_name"], req["source_tokenizer_file_name"] + ".evidence.json", "tokenizer-run-summary.json"}
          work = Path(os.environ["RUNNER_TEMP"]) / "onecore-v3-tokenizer-adoption"
          work.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(io.BytesIO(archive_bytes)) as archive:
              if set(archive.namelist()) != wanted:
                  raise SystemExit("historical tokenizer archive member list mismatch")
              for name in wanted:
                  (work / name).write_bytes(archive.read(name))
          source = work / req["source_tokenizer_file_name"]
          sidecar = Path(str(source) + ".evidence.json")
          if hashlib.sha256(source.read_bytes()).hexdigest() != req["source_tokenizer_sha256"]:
              raise SystemExit("historical tokenizer JSON digest mismatch")
          if hashlib.sha256(sidecar.read_bytes()).hexdigest() != req["source_evidence_sha256"]:
              raise SystemExit("historical tokenizer evidence digest mismatch")
          config = V3Config()
          raw = yaml.safe_load(Path("onecore-ai/configs/onecore-v3-research.yaml").read_text(encoding="utf-8"))
          if not config.is_canonical or raw.get("architecture_version") != config.architecture_version:
              raise SystemExit("adoption requires exact corrected-spec-3 config")
          output = work / req["tokenizer_file_name"]
          adopted = adopt_v3_tokenizer(source, sidecar, output, config=config,
              expected_source_tokenizer_sha256=req["source_tokenizer_sha256"],
              expected_source_evidence_sha256=req["source_evidence_sha256"],
              expected_train_manifest_sha256=req["train_manifest_sha256"],
              expected_external_text_rows_sha256=req["external_text_rows_sha256"],
              expected_external_train_text_records=req["external_train_text_records"],
              source_run_id=req["source_run_id"], source_artifact_id=req["source_artifact_id"],
              source_artifact_sha256=req["source_artifact_digest"])
          verified = verify_v3_tokenizer(output, config=config,
              expected_train_manifest_sha256=req["train_manifest_sha256"])
          if not adopted["source_tokenizer_bytes_preserved"] or verified["tokenizer_sha256"] != req["source_tokenizer_sha256"]:
              raise SystemExit("tokenizer bytes changed during adoption")
          summary = {"architecture_version": config.architecture_version,
              "source_run_id": req["source_run_id"], "source_artifact_id": req["source_artifact_id"],
              "source_artifact_digest": req["source_artifact_digest"], "source_archive_sha256_verified": archive_sha,
              "tokenizer_file": output.name, "tokenizer_sha256": verified["tokenizer_sha256"],
              "tokenizer_contract_sha256": verified["tokenizer_contract_sha256"],
              "vocab_size": verified["vocab_size_actual"], "external_train_text_records": verified["external_train_text_records"],
              "train_manifest_sha256": verified["train_manifest_sha256"],
              "external_text_rows_sha256": verified["external_text_rows_sha256"],
              "validation_or_test_rows_used": verified["validation_or_test_rows_used"],
              "tokenizer_bytes_modified": False, "refit_performed": False}
          (work / "tokenizer-run-summary.json").write_text(json.dumps(summary, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(summary, indent=2))
          PY
      - name: Publish adopted 32K tokenizer and provenance evidence
        uses: actions/upload-artifact@v4
        with:
          name: onecore-v3-tokenizer-32000-adopted-45336933362
          path: ${{ runner.temp }}/onecore-v3-tokenizer-adoption/
          if-no-files-found: error
          retention-days: 90
