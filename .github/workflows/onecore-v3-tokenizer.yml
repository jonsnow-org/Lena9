name: OneCore V3 — external train-only tokenizer

on:
  push:
    branches: [research/onecore-v3-implementation]
    paths: ["onecore-ai/v3-tokenizer-request.json"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: onecore-v3-tokenizer-corpus-45325008221
  cancel-in-progress: false

jobs:
  fit_external_train_tokenizer:
    name: Fit and verify the V3 tokenizer from external train text only
    if: github.ref == 'refs/heads/research/onecore-v3-implementation'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      PYTHONPATH: onecore-ai/src
      GH_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
    steps:
      - name: Checkout canonical V3 branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: onecore-ai/pyproject.toml

      - name: Check source corpus and prevent duplicate tokenizer fitting
        id: preflight
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          from pathlib import Path
          from urllib.request import Request, urlopen
          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          request_data = json.loads(Path("onecore-ai/v3-tokenizer-request.json").read_text(encoding="utf-8"))
          headers = {"Authorization": f"Bearer {token}", "Accept": "application/vnd.github+json"}
          def get(path):
              with urlopen(Request(f"https://api.github.com/repos/{repo}{path}", headers=headers), timeout=45) as response:
                  return json.loads(response.read().decode("utf-8"))
          source_run = get(f"/actions/runs/{request_data['source_run_id']}")
          if source_run.get("conclusion") != "success" or source_run.get("head_sha") != request_data["source_run_sha"]:
              raise RuntimeError("pinned V3 corpus source run did not pass its exact SHA/conclusion check")
          artifacts = get(f"/actions/runs/{request_data['source_run_id']}/artifacts?per_page=100").get("artifacts", [])
          source = [item for item in artifacts if int(item.get("id", 0)) == int(request_data["source_artifact_id"])]
          if len(source) != 1:
              raise RuntimeError("pinned V3 corpus artifact id is missing or ambiguous")
          item = source[0]
          if item.get("name") != request_data["source_artifact_name"] or item.get("expired") is True:
              raise RuntimeError("pinned V3 corpus artifact name/retention status is invalid")
          if int(item.get("size_in_bytes", 0)) < int(request_data["source_artifact_minimum_bytes"]):
              raise RuntimeError("pinned V3 corpus artifact is unexpectedly small")
          runs = get("/actions/runs?branch=research/onecore-v3-implementation&per_page=100").get("workflow_runs", [])
          already_published = False
          for run in runs:
              if run.get("path") != ".github/workflows/onecore-v3-tokenizer.yml":
                  continue
              existing = get(f"/actions/runs/{run['id']}/artifacts?per_page=100").get("artifacts", [])
              if any(a.get("name") == request_data["output_artifact_name"] and not a.get("expired", False) for a in existing):
                  already_published = True
                  break
          print(f"source_run_id={request_data['source_run_id']}")
          print(f"source_artifact_id={request_data['source_artifact_id']}")
          print(f"source_artifact_bytes={item['size_in_bytes']}")
          print(f"already_published={str(already_published).lower()}")
          PY

      - name: Install CPU-only PyTorch and tokenizer range dependencies
        if: steps.preflight.outputs.already_published != 'true'
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "tokenizers>=0.19,<1" "PyYAML>=6,<7" "requests>=2.31,<3" "remotezip>=0.12,<1"
          python -m pip install --no-deps -e onecore-ai

      - name: Range-extract only V3 train.jsonl from the published corpus
        if: steps.preflight.outputs.already_published != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/onecore-v3-tokenizer-input"
          python - <<'PY'
          import json, os
          from pathlib import Path
          from onecore.v3.artifact import extract_v3_train_manifest
          request_data = json.loads(Path("onecore-ai/v3-tokenizer-request.json").read_text(encoding="utf-8"))
          output = Path(os.environ["RUNNER_TEMP"]) / "onecore-v3-tokenizer-input" / "train.jsonl"
          result = extract_v3_train_manifest(os.environ["GITHUB_REPOSITORY"], int(request_data["source_artifact_id"]), os.environ["GH_TOKEN"], output)
          if result["member"] != request_data["train_manifest_member"]:
              raise RuntimeError(f"unexpected V3 train manifest member: {result['member']}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as stream:
              stream.write(f"train_manifest_sha256={result['sha256']}\n")
          print(json.dumps(result, ensure_ascii=False, indent=2))
          PY

      - name: Fit and verify exact V3 BPE vocabulary on external train text only
        if: steps.preflight.outputs.already_published != 'true'
        run: |
          python - <<'PY'
          import json, os, yaml
          from pathlib import Path
          from onecore.v3.config import V3Config
          from onecore.v3.tokenizer import train_v3_tokenizer, verify_v3_tokenizer
          project = Path("onecore-ai")
          raw = yaml.safe_load((project / "configs/onecore-v3-research.yaml").read_text(encoding="utf-8"))
          config = V3Config(**raw["model"])
          if raw.get("architecture_version") != config.architecture_version:
              raise RuntimeError("V3 YAML and V3Config architecture versions differ")
          request_data = json.loads(Path("onecore-ai/v3-tokenizer-request.json").read_text(encoding="utf-8"))
          work = Path(os.environ["RUNNER_TEMP"]) / "onecore-v3-tokenizer-input"
          manifest = work / "train.jsonl"
          output = work / request_data["tokenizer_file_name"]
          report = train_v3_tokenizer(manifest, output, config=config, minimum_text_records=int(request_data["minimum_text_records"]), minimum_characters=int(request_data["minimum_characters"]), min_frequency=int(request_data["min_frequency"]))
          verified = verify_v3_tokenizer(output, config=config, expected_train_manifest_sha256=report["train_manifest_sha256"])
          summary = {"source_run_id": request_data["source_run_id"], "source_run_sha": request_data["source_run_sha"], "source_artifact_id": request_data["source_artifact_id"], "source_artifact_name": request_data["source_artifact_name"], "range_extraction": {"full_archive_downloaded": False, "member": request_data["train_manifest_member"]}, "tokenizer": {"path": output.name, "sha256": verified["tokenizer_sha256"], "evidence_path": output.name + ".evidence.json", "vocab_size": verified["vocab_size_actual"], "external_train_text_records": verified["external_train_text_records"], "train_manifest_sha256": verified["train_manifest_sha256"], "external_text_rows_sha256": verified["external_text_rows_sha256"], "validation_or_test_rows_used": verified["validation_or_test_rows_used"], "v2_tokenizer_imported": verified["v2_tokenizer_imported"]}}
          if summary["tokenizer"]["vocab_size"] != config.text_vocab_size:
              raise RuntimeError("exact V3 vocabulary size was not achieved")
          if summary["tokenizer"]["validation_or_test_rows_used"] != 0 or summary["tokenizer"]["v2_tokenizer_imported"] is not False:
              raise RuntimeError("V3 tokenizer provenance contract failed")
          (work / "tokenizer-run-summary.json").write_text(json.dumps(summary, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          PY

      - name: Publish verified V3 tokenizer and provenance evidence
        if: steps.preflight.outputs.already_published != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: onecore-v3-tokenizer-45325008221
          path: |
            ${{ runner.temp }}/onecore-v3-tokenizer-input/onecore-v3-tokenizer-run605-vocab32000.json
            ${{ runner.temp }}/onecore-v3-tokenizer-input/onecore-v3-tokenizer-run605-vocab32000.json.evidence.json
            ${{ runner.temp }}/onecore-v3-tokenizer-input/tokenizer-run-summary.json
          if-no-files-found: error
          retention-days: 90
