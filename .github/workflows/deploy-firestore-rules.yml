name: Deploy Firestore rules

# ينشر firestore.rules إلى مشروع Firebase الحي تلقائياً عند تعديله على main —
# لم يكن هناك أي مسار نشر للقواعد، فكانت تعديلاتها تبقى في المستودع فقط.
# يستخدم نفس سر حساب الخدمة الذي يستخدمه الخادم (FIREBASE_SERVICE_ACCOUNT_JSON).

on:
  push:
    branches: [main]
    paths:
      - 'firestore.rules'
      - 'firebase.json'
  workflow_dispatch:

jobs:
  deploy-rules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Write service account credentials
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$SA_JSON" ]; then
            echo "::error::Missing GitHub secret FIREBASE_SERVICE_ACCOUNT_JSON (same value as the Render env var)."
            exit 1
          fi
          printf '%s' "$SA_JSON" > "$RUNNER_TEMP/sa.json"

      - name: Deploy rules
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: npx --yes firebase-tools@13 deploy --only firestore:rules --project literium --non-interactive
