name: Deploy web app to Cloud Run

# مسار نشر ثانٍ مستقل تماماً عن AI Studio — يبني صورة الحاوية من الكود
# الحقيقي في هذا المستودع وينشرها مباشرة على Cloud Run تحت مشروع
# "literium" الحقيقي الذي تملكه وتراه في حسابك. لا يعتمد على أي حالة
# داخلية لـ AI Studio ولا مزامنة GitHub الهشة.
#
# يعمل فقط عند دفع/دمج إلى main، ويمكن تشغيله يدوياً كذلك.

on:
  push:
    branches: [main]
    paths-ignore:
      - 'android-native/**'
      - 'docs/**'
      - 'archive/**'
      - '**.md'
  workflow_dispatch: {}

concurrency:
  group: deploy-web-cloudrun
  cancel-in-progress: true

env:
  GCP_PROJECT_ID: literium
  GCP_REGION: us-west1
  SERVICE_NAME: literium-web
  AR_REPO: literium-web

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY_LITERIUM }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Ensure Artifact Registry repo exists
        run: |
          gcloud artifacts repositories describe "$AR_REPO" \
            --location="$GCP_REGION" --project="$GCP_PROJECT_ID" \
            || gcloud artifacts repositories create "$AR_REPO" \
                 --repository-format=docker --location="$GCP_REGION" \
                 --project="$GCP_PROJECT_ID" \
                 --description="Literium web app container images"

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Build and push image
        env:
          IMAGE: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/${{ env.SERVICE_NAME }}
        run: |
          docker build \
            --build-arg VITE_TELEGRAM_BOT_USERNAME="${{ secrets.VITE_TELEGRAM_BOT_USERNAME }}" \
            --build-arg VITE_GOOGLE_OAUTH_CLIENT_ID="${{ secrets.VITE_GOOGLE_OAUTH_CLIENT_ID }}" \
            -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" .
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

      - name: Write runtime env file
        # نكتب متغيرات البيئة إلى ملف YAML بدل --set-env-vars المتكرر: القيمة
        # الأكبر خطراً هنا (FIREBASE_SERVICE_ACCOUNT_JSON) نص JSON يحوي فواصل
        # وأسطراً جديدة، وصيغة --set-env-vars المتكررة تستبدل القيمة السابقة
        # بالكامل بدل دمجها، وتتعطل مع أي فاصلة داخل القيمة. yaml.safe_dump
        # يضمن تهريباً صحيحاً بصرف النظر عن محتوى القيمة.
        run: |
          pip install --quiet --disable-pip-version-check pyyaml
          python3 - <<'PYEOF'
          import yaml, os
          data = {
              "NODE_ENV": "production",
              "GEMINI_API_KEY": os.environ.get("SECRET_GEMINI_API_KEY", ""),
              "APP_URL": os.environ.get("SECRET_WEB_APP_URL", ""),
              "STRIPE_SECRET_KEY": os.environ.get("SECRET_STRIPE_SECRET_KEY", ""),
              "STRIPE_WEBHOOK_SECRET": os.environ.get("SECRET_STRIPE_WEBHOOK_SECRET", ""),
              "FIREBASE_SERVICE_ACCOUNT_JSON": os.environ.get("SECRET_FIREBASE_SERVICE_ACCOUNT_JSON", ""),
              "CLOUDINARY_CLOUD_NAME": os.environ.get("SECRET_CLOUDINARY_CLOUD_NAME", ""),
              "CLOUDINARY_API_KEY": os.environ.get("SECRET_CLOUDINARY_API_KEY", ""),
              "CLOUDINARY_API_SECRET": os.environ.get("SECRET_CLOUDINARY_API_SECRET", ""),
              "TELEGRAM_BOT_TOKEN": os.environ.get("SECRET_TELEGRAM_BOT_TOKEN", ""),
              "NOWPAYMENTS_API_KEY": os.environ.get("SECRET_NOWPAYMENTS_API_KEY", ""),
              "NOWPAYMENTS_IPN_SECRET": os.environ.get("SECRET_NOWPAYMENTS_IPN_SECRET", ""),
              "BOTS_CRON_SECRET": os.environ.get("SECRET_BOTS_CRON_SECRET", ""),
          }
          with open("cloudrun-env.yaml", "w") as f:
              yaml.safe_dump(data, f, default_flow_style=False)
          PYEOF
        env:
          SECRET_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SECRET_WEB_APP_URL: ${{ secrets.WEB_APP_URL }}
          SECRET_STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          SECRET_STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          SECRET_FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          SECRET_CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          SECRET_CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          SECRET_CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          SECRET_TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SECRET_NOWPAYMENTS_API_KEY: ${{ secrets.NOWPAYMENTS_API_KEY }}
          SECRET_NOWPAYMENTS_IPN_SECRET: ${{ secrets.NOWPAYMENTS_IPN_SECRET }}
          SECRET_BOTS_CRON_SECRET: ${{ secrets.BOTS_CRON_SECRET }}

      - name: Deploy to Cloud Run
        env:
          IMAGE: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/${{ env.SERVICE_NAME }}
        run: |
          gcloud run deploy "$SERVICE_NAME" \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" \
            --image="$IMAGE:${{ github.sha }}" \
            --platform=managed \
            --allow-unauthenticated \
            --port=8080 \
            --env-vars-file=cloudrun-env.yaml

      - name: Show live URL
        run: |
          gcloud run services describe "$SERVICE_NAME" \
            --project="$GCP_PROJECT_ID" --region="$GCP_REGION" \
            --format='value(status.url)'
