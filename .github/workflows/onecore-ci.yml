name: OneCore — single-model integrity and CPU gates

on:
  push:
    branches: [research/onecore-v3-implementation]
    paths:
      - "onecore-ai/**"
      - ".github/workflows/onecore-ci.yml"
      - ".github/workflows/onecore-v3-training.yml"
      - ".github/workflows/onecore-v3-tokenizer.yml"
      - ".github/workflows/onecore-source-package.yml"
  pull_request:
    branches: [main]
    paths:
      - "onecore-ai/**"
      - ".github/workflows/onecore-ci.yml"
      - ".github/workflows/onecore-v3-training.yml"
      - ".github/workflows/onecore-v3-tokenizer.yml"
      - ".github/workflows/onecore-source-package.yml"
  workflow_dispatch:
    inputs:
      restore_v3_corpus:
        description: "Restore the existing validated OneCore external corpus snapshot"
        required: false
        default: false
        type: boolean
      benchmark_v3_resources:
        description: "Measure real OneCore CPU RSS and throughput without optimizer updates"
        required: false
        default: false
        type: boolean
      audit_v3_checkpoint:
        description: "Audit the current OneCore configuration checkpoint round-trip; no optimizer updates"
        required: false
        default: false
        type: boolean
      evaluate_v3_checkpoint_run_id:
        description: "Run held-out diagnostics for a completed OneCore checkpoint run ID; no weight updates"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: onecore-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify the only OneCore model, architecture and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: onecore-ai/pyproject.toml

      - name: Install CPU-only PyTorch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install OneCore and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e "onecore-ai[dev,corpus-restore]"

      - name: Compile the complete OneCore package
        run: python -m compileall -q onecore-ai/src

      - name: Verify exact corrected parameters, shared T-LDM and FLOPs
        env:
          PYTHONPATH: onecore-ai/src
        run: |
          python - <<'PY'
          import json
          from onecore.v3 import V3Config
          from onecore.v3.report import build_report
          report = build_report()
          assert report["architecture_version"] == "onecore-v3-corrected-spec-3", report
          assert report["trainable_parameters"] == 86_152_897, report
          assert report["fp32_parameter_storage_bytes"] == 344_611_588, report
          assert report["fp16_parameter_storage_bytes"] == 172_305_794, report
          assert report["unified_vocab_size"] == 33_048, report
          assert report["width"] == 1_024 and report["hidden_size"] == 2_730, report
          assert report["shared_block_applications"] == 12, report
          assert report["tldm_additional_trainable_parameters"] == 0, report
          assert report["quality_certified"] is False, report
          cfg = V3Config()
          assert cfg.is_canonical and cfg.fingerprint == report["config_sha256"]
          flops = report["flops"]
          assert flops["config_sha256"] == report["config_sha256"]
          assert flops["sequence_length_examples"]["128"]["joint_step_train_flops"] == 1_516_166_184_960, flops
          assert flops["sequence_length_examples"]["512"]["joint_step_train_flops"] == 6_136_611_471_360, flops
          assert flops["paths"]["text"]["breakdown"]["native_tldm"]["tied_text_output_projection"] > 0
          assert flops["paths"]["video"]["sequence_tokens"] <= 512, flops
          assert flops["joint_micro_batches_per_update"] == 5
          assert report["quantized_runtime_available"] is False
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY

      - name: Run the complete OneCore unit and regression suite
        run: pytest -q onecore-ai/tests

      - name: Enforce one model path and one guarded trainer
        run: |
          python - <<'PY'
          import json, tomllib
          from pathlib import Path
          root = Path("onecore-ai")
          legacy_paths = [
              root / "src/onecore/model.py", root / "src/onecore/config.py",
              root / "src/onecore/train.py", root / "src/onecore/training_loop.py",
              root / "src/onecore/checkpoint.py", root / "src/onecore/tokenizer.py",
              Path(".github/workflows/onecore-training.yml"),
              Path(".github/workflows/onecore-bootstrap.yml"),
              Path(".github/actions/onecore-acquire/action.yml"),
              Path(".github/actions/onecore-train/action.yml"),
              root / "configs/phone-research.yaml",
          ]
          present = [str(path) for path in legacy_paths if path.exists()]
          if present:
              raise SystemExit("parallel legacy OneCore paths remain: " + ", ".join(present))
          if (root / "notebooks").exists():
              raise SystemExit("legacy notebook training path must not remain alongside the single trainer")
          assert (root / "src/onecore/v3/core.py").is_file()
          core = (root / "src/onecore/v3/core.py").read_text(encoding="utf-8")
          assert "def forward_tldm(" in core and "def generate_tldm(" in core
          training = Path(".github/workflows/onecore-v3-training.yml").read_text(encoding="utf-8")
          assert "&& false" in training
          assert "--tldm-diffusion-weight" in training
          request = json.loads((root / "v3-training-request.json").read_text(encoding="utf-8"))
          assert request["tldm_diffusion_weight"] == 0.15
          assert request["steps"] == 5 and request["checkpoint_every"] == 1
          package = tomllib.loads((root / "pyproject.toml").read_text(encoding="utf-8"))
          scripts = package["project"]["scripts"]
          assert scripts["onecore"] == "onecore.v3.inference:main"
          protocol = (root / "SESSION_PROTOCOL.md").read_text(encoding="utf-8")
          assert "compare-and-swap" in protocol and "remain read-only" in protocol
          print("Single model path, native T-LDM and fail-closed training guard verified.")
          PY

      - name: Smoke-test FineWeb-2 streaming and exact cursor resume
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: |
          python - <<'PY'
          import os
          import tempfile
          from huggingface_hub import HfApi
          from datasets import load_dataset
          from onecore.crawlers import StatefulStreamCursor
          repo = "HuggingFaceFW/fineweb-2"
          revision = HfApi().dataset_info(repo).sha
          kwargs = {"path": repo, "name": "arb_Arab", "split": "train", "streaming": True, "revision": revision}
          dataset = load_dataset(**kwargs)
          with tempfile.TemporaryDirectory(prefix="onecore-fineweb-cursor-") as tmp:
              cursor = StatefulStreamCursor(tmp, "onecore-text", "fineweb2_full_ar", repo, "arb_Arab", "train", revision)
              stream, offset, mode = cursor.restore(dataset)
              assert (offset, mode) == (0, "fresh")
              iterator = iter(stream)
              first = next(iterator)
              assert isinstance(first.get("text"), str) and len(first["text"].strip()) >= 24
              saved = cursor.save(stream, 1)
              assert saved["cursor_mode"] == "state_dict", saved
              expected_next = next(iterator)
              resumed, offset, mode = cursor.restore(dataset)
              actual_next = next(iter(resumed))
              assert offset == 1 and mode == "state_dict", (offset, mode)
              assert actual_next == expected_next
              print({"source": repo, "config": "arb_Arab", "revision": revision, "resume_mode": mode, "resume_exact": True}, flush=True)
          os._exit(0)
          PY

  v3-corpus-restore:
    name: Restore and validate the existing OneCore corpus snapshot
    needs: verify
    # The multi-gigabyte corpus restore is manual-only and disabled unless explicitly selected.
    if: github.ref == 'refs/heads/research/onecore-v3-implementation' && github.event_name == 'workflow_dispatch' && inputs.restore_v3_corpus == true
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install FFmpeg shared libraries required by TorchCodec
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg

      - name: Install CPU-only PyTorch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install OneCore, corpus-restore, and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e "onecore-ai[dev,corpus-restore]"

      - name: Install CPU-only TorchCodec wheels
        run: python -m pip install "torchcodec>=0.17,<0.18" --index-url https://download.pytorch.org/whl/cpu

      - name: Verify CPU-only TorchCodec audio and video support
        env:
          PYTHONPATH: onecore-ai/src
        run: |
          python - <<'PY'
          import importlib.metadata
          import torch
          from datasets import config as datasets_config
          from torchcodec.decoders import AudioDecoder, VideoDecoder

          assert torch.version.cuda is None, torch.__version__
          assert datasets_config.TORCHCODEC_AVAILABLE, "datasets cannot import TorchCodec"
          assert AudioDecoder is not None and VideoDecoder is not None
          print({
              "torch": torch.__version__,
              "torchcodec": importlib.metadata.version("torchcodec"),
              "datasets_torchcodec_available": datasets_config.TORCHCODEC_AVAILABLE,
              "cpu_only": True,
              "audio_decoder": AudioDecoder.__name__,
              "video_decoder": VideoDecoder.__name__,
          })
          PY

      - name: Use the canonical OneCore source registry
        run: |
          cp onecore-ai/data/corpus-source-snapshot-45325008221.yaml "$RUNNER_TEMP/onecore-sources.yaml"

      - name: Locate latest durable V3 media progress snapshot
        id: resume-progress
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json, os
          from urllib.request import Request, urlopen
          repo, token = os.environ["GITHUB_REPOSITORY"], os.environ["GH_TOKEN"]
          branch, current = os.environ["GITHUB_REF_NAME"], os.environ["CURRENT_RUN_ID"]
          headers = {"Authorization": f"Bearer {token}", "Accept": "application/vnd.github+json"}
          def get(url):
              with urlopen(Request(url, headers=headers), timeout=30) as response:
                  return json.loads(response.read().decode("utf-8"))
          runs = get(f"https://api.github.com/repos/{repo}/actions/runs?branch={branch}&per_page=30")
          selected = None
          for run in runs.get("workflow_runs", []):
              if str(run.get("id")) == current or run.get("path") != ".github/workflows/onecore-ci.yml":
                  continue
              if run.get("head_branch") != branch:
                  continue
              artifacts = get(run["artifacts_url"] + "?per_page=100").get("artifacts", [])
              candidates = [
                  item for item in artifacts
                  if item.get("name", "").startswith("onecore-v3-restore-progress-")
                  and not item.get("expired", False)
              ]
              if candidates:
                  candidates.sort(key=lambda item: item.get("created_at", ""), reverse=True)
                  selected = (run["id"], candidates[0]["name"])
                  break
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              if selected:
                  output.write(f"available=true\nrun_id={selected[0]}\nartifact_name={selected[1]}\n")
                  print({"resume_run_id": selected[0], "artifact_name": selected[1]})
              else:
                  output.write("available=false\n")
                  print("No prior V3 progress artifact; restoring from the existing validated corpus snapshot.")
          PY

      - name: Restore prior V3 media progress and raw assets
        if: steps.resume-progress.outputs.available == 'true'
        uses: actions/download-artifact@v7
        with:
          name: ${{ steps.resume-progress.outputs.artifact_name }}
          run-id: ${{ steps.resume-progress.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/onecore-v3-restore-progress

      - name: Merge prior V3 progress snapshot into the working corpus
        if: steps.resume-progress.outputs.available == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/onecore-v3-corpus/v3/data"
          cp -a "$RUNNER_TEMP/onecore-v3-restore-progress/." "$RUNNER_TEMP/onecore-v3-corpus/v3/"

      - name: Convert the existing corpus with HTTP range reads
        env:
          PYTHONPATH: onecore-ai/src
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HF_HUB_DISABLE_TELEMETRY: "1"
          PYTHONUNBUFFERED: "1"
        run: |
          python -m onecore.v3.cli \
            --artifact-id 14715699177 \
            --github-repo jonsnow-org/Lena9 \
            --source-registry "$RUNNER_TEMP/onecore-sources.yaml" \
            --output-root "$RUNNER_TEMP/onecore-v3-corpus" \
            --report-output "$RUNNER_TEMP/onecore-v3-conversion-report.json" \
            --resume-progress "$RUNNER_TEMP/onecore-v3-corpus/v3/restore-progress.jsonl" \
            --max-scan-rows-per-source-split 100000

      - name: Publish conversion gate result
        id: conversion-summary
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path(os.environ["RUNNER_TEMP"]) / "onecore-v3-conversion-report.json"
          passed = False
          if path.is_file():
              report = json.loads(path.read_text(encoding="utf-8"))
              passed = bool(report.get("manifest_gate", {}).get("passed"))
              acquisition = report.get("missing_media_acquisition") or {}
              print({
                  "blocked": report.get("blocked"),
                  "restoration_incomplete": report.get("restoration_incomplete", report.get("blocked")),
                  "acquisition_incomplete": report.get("acquisition_incomplete", acquisition.get("blocked", False)),
                  "converted_records": report.get("converted_records"),
                  "gate_passed": passed,
                  "coverage": report.get("manifest_gate", {}).get("coverage"),
                  "missing_media": acquisition.get("remaining_deficits"),
                  "media_restore_errors": report.get("errors", []),
                  "media_restore_skipped": report.get("skipped", {}),
                  "acquisition_errors": acquisition.get("errors", []),
                  "acquisition_skipped_sources": acquisition.get("skipped_sources", {}),
                  "sources_scanned": acquisition.get("sources_scanned", []),
              })
          else:
              print("Conversion report was not produced.")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"gate_passed={str(passed).lower()}\n")
          PY

      - name: Fail when the external-only V3 corpus gate is blocked
        if: steps.conversion-summary.outputs.gate_passed != 'true'
        run: |
          echo "::error::V3 external-only corpus gate did not pass; no V3 corpus artifact will be published."
          exit 1

      - name: Upload durable partial V3 media progress for the next bounded run
        if: always() && steps.conversion-summary.outputs.gate_passed != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: onecore-v3-restore-progress-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/onecore-v3-corpus/v3/restore-progress.jsonl
            ${{ runner.temp }}/onecore-v3-corpus/v3/data/assets
            ${{ runner.temp }}/onecore-v3-corpus/v3/data/resume-cache/crawlers
          if-no-files-found: warn
          retention-days: 14

      - name: Upload V3 conversion report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: onecore-v3-conversion-report-${{ github.run_id }}
          path: ${{ runner.temp }}/onecore-v3-conversion-report.json
          if-no-files-found: warn
          retention-days: 30

      - name: Upload V3 corpus only after external-only gate passes
        if: steps.conversion-summary.outputs.gate_passed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: onecore-v3-corpus-${{ github.run_id }}
          path: ${{ runner.temp }}/onecore-v3-corpus/v3
          if-no-files-found: error
          retention-days: 30


  v3-checkpoint-artifact-audit:
    name: Audit step-zero V3 checkpoint save and restore against real artifacts
    needs: verify
    if: github.ref == 'refs/heads/research/onecore-v3-implementation' && (inputs.audit_v3_checkpoint || (github.event_name == 'push' && contains(github.event.head_commit.message, '[run-v3-checkpoint-audit]')))
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PYTHONPATH: onecore-ai/src
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout canonical V3 branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: onecore-ai/pyproject.toml
      - name: Install CPU-only PyTorch and bounded artifact access
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e "onecore-ai[corpus-restore]"
      - name: Download the pinned V3 tokenizer and evidence sidecar
        uses: actions/download-artifact@v7
        with:
          name: onecore-v3-tokenizer-45325008221
          run-id: 45336933362
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/onecore-v3-tokenizer
      - name: Download the pinned V3 external-only conversion report
        uses: actions/download-artifact@v7
        with:
          name: onecore-v3-conversion-report-45325008221
          run-id: 45325008221
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/onecore-v3-conversion-report
      - name: Re-attest the unchanged historical 32K tokenizer for corrected-spec-3
        run: |
          python - <<'PY'
          from pathlib import Path
          from onecore.v3.config import V3Config
          from onecore.v3.tokenizer import adopt_v3_tokenizer, verify_v3_tokenizer
          folder = Path("${{ runner.temp }}/onecore-v3-tokenizer")
          source = folder / "onecore-v3-tokenizer-run605-vocab32000.json"
          source_sidecar = Path(str(source) + ".evidence.json")
          output = folder / "onecore-tokenizer-text32000-adopted-20261128.json"
          adopted = adopt_v3_tokenizer(
              source, source_sidecar, output, config=V3Config(),
              expected_source_tokenizer_sha256="569f1b61e017dcf5c8ba9fef22a8002cc48d5ea3c26504bdae83f53834d00e76",
              expected_source_evidence_sha256="b60e5077767f79b1316635ed45343ed5c59ce2602f41d24759a25a386ea33e16",
              expected_train_manifest_sha256="d499968cdd5e1869ae7b5d9866261e8aad8fe091ad9096b13067bfb6a83f9205",
              expected_external_text_rows_sha256="6d60d6a07fbd82932373c449735d1b73cd882bcd14390e07a60400c2cc97e720",
              expected_external_train_text_records=591525, source_run_id=45336933362,
              source_artifact_id=14894835517,
              source_artifact_sha256="sha256:47246c85500ed2647aacfd00187dacf4dedae1f10b180910ff55f71463851bd6",
          )
          verified = verify_v3_tokenizer(output, config=V3Config(),
              expected_train_manifest_sha256="d499968cdd5e1869ae7b5d9866261e8aad8fe091ad9096b13067bfb6a83f9205")
          assert adopted["source_tokenizer_bytes_preserved"] and verified["vocab_size_actual"] == 32000
          print({"tokenizer_sha256": verified["tokenizer_sha256"], "vocab": verified["vocab_size_actual"],
                 "source_rows": verified["external_train_text_records"], "heldout_rows": verified["validation_or_test_rows_used"]})
          PY
      - name: Audit real V3 manifests, tokenizer, initial source cursors and step-zero checkpoint state
        run: |
          python -m onecore.v3.checkpoint_audit \
            --repo "${{ github.repository }}" \
            --corpus-artifact-id 14892594659 \
            --tokenizer "${{ runner.temp }}/onecore-v3-tokenizer/onecore-tokenizer-text32000-adopted-20261128.json" \
            --tokenizer-sha256 569f1b61e017dcf5c8ba9fef22a8002cc48d5ea3c26504bdae83f53834d00e76 \
            --conversion-report "${{ runner.temp }}/onecore-v3-conversion-report/onecore-v3-conversion-report.json" \
            --conversion-report-sha256 5976ad7f5e3149a31bd1da67308bf228cf0afb31ba970e00481dda04b1f73941 \
            --output "${{ runner.temp }}/onecore-v3-checkpoint-audit.json" \
            --work-directory "${{ runner.temp }}/onecore-v3-checkpoint-audit-work"
          cat "${{ runner.temp }}/onecore-v3-checkpoint-audit.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload V3 checkpoint audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: onecore-v3-checkpoint-audit-${{ github.run_id }}
          path: ${{ runner.temp }}/onecore-v3-checkpoint-audit.json
          if-no-files-found: ignore
          retention-days: 90


  v3-heldout-evaluation:
    name: Evaluate completed V3 checkpoint on held-out external data
    needs: verify
    if: github.ref == 'refs/heads/research/onecore-v3-implementation' && ((github.event_name == 'workflow_dispatch' && inputs.evaluate_v3_checkpoint_run_id != '') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[run-v3-evaluation:')))
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      PYTHONPATH: onecore-ai/src
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout canonical V3 branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
      - name: Resolve completed V3 training run ID
        id: evaluation-run
        env:
          REQUESTED_RUN_ID: ${{ inputs.evaluate_v3_checkpoint_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          RUN_ID="$REQUESTED_RUN_ID"
          if [[ -z "$RUN_ID" ]]; then
            RUN_ID="$(python - <<'PY'
          import json, os, re
          event = json.load(open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8"))
          message = event.get("head_commit", {}).get("message", "")
          match = re.search(r"\[run-v3-evaluation:(\d+)\]", message)
          print(match.group(1) if match else "")
          PY
          )"
          fi
          [[ "$RUN_ID" =~ ^[0-9]+$ ]] || { echo "missing numeric V3 training run ID"; exit 2; }
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: onecore-ai/pyproject.toml
      - name: Install CPU-only PyTorch and bounded artifact access
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e "onecore-ai[corpus-restore]"
      - name: Download completed training checkpoint artifact
        uses: actions/download-artifact@v7
        with:
          name: onecore-v3-state-${{ steps.evaluation-run.outputs.run_id }}
          run-id: ${{ steps.evaluation-run.outputs.run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/onecore-v3-training
      - name: Download pinned external-only conversion report
        uses: actions/download-artifact@v7
        with:
          name: onecore-v3-conversion-report-45325008221
          run-id: 45325008221
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/onecore-v3-conversion-report
      - name: Evaluate validation and test from the trained checkpoint
        run: |
          python -m onecore.v3.evaluation_cli \
            --repo "${{ github.repository }}" \
            --training-run-id "${{ steps.evaluation-run.outputs.run_id }}" \
            --corpus-artifact-id 14892594659 \
            --checkpoint "${{ runner.temp }}/onecore-v3-training/checkpoint.pt" \
            --train-result "${{ runner.temp }}/onecore-v3-training/train_result.json" \
            --tokenizer "${{ runner.temp }}/onecore-v3-training/tokenizer.json" \
            --conversion-report "${{ runner.temp }}/onecore-v3-conversion-report/onecore-v3-conversion-report.json" \
            --per-family-records 2 \
            --output "${{ runner.temp }}/onecore-v3-heldout-evaluation.json" \
            --work-directory "${{ runner.temp }}/onecore-v3-heldout-evaluation-work"
          cat "${{ runner.temp }}/onecore-v3-heldout-evaluation.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload held-out evaluation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: onecore-v3-heldout-evaluation-${{ github.run_id }}
          path: ${{ runner.temp }}/onecore-v3-heldout-evaluation.json
          if-no-files-found: ignore
          retention-days: 90

  v3-resource-benchmark:
    name: Measure V3 CPU memory and throughput from existing artifacts
    needs: verify
    # Never overlap a corpus restore. This job is manual-only and performs no optimizer updates.
    if: github.ref == 'refs/heads/research/onecore-v3-implementation' && github.event_name == 'workflow_dispatch' && inputs.benchmark_v3_resources == true && inputs.restore_v3_corpus != true
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install CPU-only PyTorch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install OneCore and range-artifact dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e "onecore-ai[dev,corpus-restore]"

      - name: Benchmark validated real-corpus samples without downloading the full archive
        env:
          PYTHONPATH: onecore-ai/src
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONUNBUFFERED: "1"
        run: |
          python -m onecore.v3.resource_benchmark \
            --github-repo jonsnow-org/Lena9 \
            --corpus-artifact-id 14892594659 \
            --expected-corpus-run-id 45325008221 \
            --report-artifact-id 14893020087 \
            --expected-report-run-id 45325008221 \
            --tokenizer-artifact-id 14894835517 \
            --expected-tokenizer-run-id 45336933362 \
            --threads 4 --iterations 5 \
            --max-image-megapixels 2 \
            --max-audio-seconds 5 \
            --max-video-megapixels 1 \
            --max-video-frames 16 \
            --output "$RUNNER_TEMP/onecore-v3-resource-benchmark.json"

      - name: Upload measured resource evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: onecore-v3-resource-benchmark-${{ github.run_id }}
          path: ${{ runner.temp }}/onecore-v3-resource-benchmark.json
          if-no-files-found: ignore
          retention-days: 30
