name: Build Empty Test APK (diagnostic)

# سير تشخيصي منفصل تماماً عن build-flutter-apk.yml — لا يلمس flutter_app/
# إطلاقاً. الهدف: بناء أبسط تطبيق Flutter ممكن (قالب flutter create
# الافتراضي، بلا Firebase ولا AdMob ولا أي حزمة إضافية) بنفس أدوات البناء
# بالضبط (نفس إصدار Flutter، نفس التوقيع)، لعزل السبب الجذري للانهيار
# الفوري الذي يواجهه المستخدم: هل هو في كود/حزم Firebase-AdMob تحديداً، أم
# في سلسلة أدوات البناء نفسها (Kotlin/AGP)؟ إن فتحت هذه النسخة الفارغة
# بشكل طبيعي والتطبيق الحقيقي لا يزال ينهار، فالسبب في Firebase/AdMob
# تحديداً. وإن انهارت هي أيضاً، فالمشكلة أعمق من ذلك بكثير.

on:
  workflow_dispatch:

jobs:
  build-empty-test-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Create the bare-minimum Flutter test app
        run: |
          flutter create --platforms=android --org=studio.ai.literium.test --project-name=empty_test_app empty_test_app

      # نفس مفتاح التوقيع المستخدم في build-flutter-apk.yml — لا حاجة لمفتاح
      # جديد، توقيع الحزمة لا علاقة له بـ applicationId التطبيق التشخيصي.
      - name: Add release signing config
        working-directory: empty_test_app
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/literium.keystore

          python3 - <<'PY'
          import os

          app_gradle_path = "android/app/build.gradle.kts" if os.path.exists("android/app/build.gradle.kts") else "android/app/build.gradle"
          is_kts = app_gradle_path.endswith(".kts")
          text = open(app_gradle_path).read()
          if "signingConfigs" not in text:
              if is_kts:
                  signing_block = '''
          android {
              signingConfigs {
                  create("release") {
                      storeFile = file("literium.keystore")
                      storePassword = System.getenv("KEYSTORE_PASSWORD")
                      keyAlias = "literium"
                      keyPassword = System.getenv("KEYSTORE_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig = signingConfigs.getByName("release")
                  }
              }
          }
          '''
              else:
                  signing_block = '''
          android {
              signingConfigs {
                  release {
                      storeFile file("literium.keystore")
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias "literium"
                      keyPassword System.getenv("KEYSTORE_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          '''
              text += signing_block
              open(app_gradle_path, "w").write(text)
          PY

      - name: flutter pub get
        working-directory: empty_test_app
        run: flutter pub get

      - name: Build signed release APK
        working-directory: empty_test_app
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: flutter build apk --release

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Literium-empty-test-apk
          path: empty_test_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
