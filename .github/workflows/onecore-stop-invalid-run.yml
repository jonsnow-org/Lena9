name: OneCore — stop disqualified continuation
on:
  push:
    branches: [research/onecore-foundation]
    paths: [".github/workflows/onecore-stop-invalid-run.yml"]

permissions:
  actions: write
  contents: read

jobs:
  stop-invalid-run:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Force-cancel the stuck disqualified OneCore workflow run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          gh api --method POST "/repos/${GH_REPOSITORY}/actions/runs/44983411821/force-cancel"
          echo "Force-cancel request sent for disqualified OneCore run 44983411821."
