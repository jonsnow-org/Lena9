name: Cancel superseded OneCore training run

on:
  push:
    branches:
      - research/onecore-foundation
    paths:
      - ".github/onecore-cancel-run.txt"

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out cancellation request
        uses: actions/checkout@v5
      - name: Cancel stale run holding the OneCore training lock
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          run_id="$(tr -d '[:space:]' < .github/onecore-cancel-run.txt)"
          if [[ ! "$run_id" =~ ^[0-9]+$ ]]; then
            echo "Invalid workflow run ID in cancellation request"
            exit 2
          fi
          gh run cancel "$run_id" --repo jonsnow-org/Lena9
          echo "Cancellation requested for superseded OneCore run $run_id"
