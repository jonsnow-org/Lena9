name: Sync to AI Studio (literium-deploy)

on:
  push:
    branches: [main]
    paths-ignore:
      - 'android-native/**'
      - '.github/workflows/build-kotlin-apk.yml'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Lena9
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Push dist to literium-deploy
        env:
          DEPLOY_TOKEN: ${{ secrets.AI_STUDIO_DEPLOY_TOKEN }}
        run: |
          cd dist
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "sync: $(date -u '+%Y-%m-%d %H:%M') UTC"
          git branch -M main
          git remote add origin https://x-access-token:${DEPLOY_TOKEN}@github.com/jonsnowx1r-lab/literium-deploy.git
          for attempt in 1 2 3 4; do
            if git push -f origin main; then
              echo "Push succeeded"
              exit 0
            fi
            echo "Push failed (attempt $attempt), retrying in $((2 ** attempt))s..."
            sleep $((2 ** attempt))
          done
          echo "::error::Push failed after 4 attempts"
          exit 1
