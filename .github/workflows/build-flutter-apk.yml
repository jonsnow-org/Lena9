name: Build Flutter Android APK

# يبني تطبيق Literium الأصيل (Flutter) — منفصل تماماً عن سير build-apk.yml
# الخاص بالنسخة السابقة (TWA)، الذي بقي كما هو بلا أي تعديل.
#
# ⚠️ هذا السير يشغّل `flutter create` على مشغّل GitHub نفسه (اتصال حقيقي +
# أدوات Flutter حقيقية) لتوليد مجلد android/ الأصيل تلقائياً، بدل كتابته
# يدوياً هنا — بنفس منطق سير build-apk.yml مع Bubblewrap سابقاً: لا يوجد
# Flutter مثبَّت في بيئة كتابة هذا الكود، فتوليد المشروع الأصيل يتم في
# المكان الوحيد الذي يملك الأداة الحقيقية.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'flutter_app/**'
      - '.github/workflows/build-flutter-apk.yml'

permissions:
  contents: write

jobs:
  build-flutter-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # مثبَّت على إصدار محدد بدل channel: stable وحدها — قناة stable انتقلت
      # مؤخراً جداً (خلال آخر يوم أو يومين) إلى Flutter 3.47 الذي يفعّل AGP 9
      # بدعم Kotlin مدمَج جديد كلياً؛ 3.44 كانت الإصدار المستقر منذ أشهر (مايو
      # 2026) قبل ذلك. أربعة عشر تشغيلاً متتالياً فشلت جميعها بنفس خطأ ترجمة
      # Kotlin داخل firebase_auth تحديداً تحت 3.47 — وحقيقة أن firebase_auth
      # 6.6.0 نُشر قبل ~40 ساعة فقط توحي بأن هذا تعارض طازج بين أحدث إصداري
      # Flutter وFirebase لم يتكيّف معه أحدهما بعد. التثبيت على 3.44.7
      # (المسار الأطول اختباراً) يتفادى AGP 9/Kotlin المدمَج كلياً بدل محاولة
      # إصلاح تعارض في مُصرِّف Kotlin نفسه لا نملك السيطرة عليه.
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # google-services.json الحقيقي (من Firebase Console → مشروع literium
      # → إضافة تطبيق Android) — سرّ FLUTTER_GOOGLE_SERVICES_JSON_BASE64،
      # يُضاف يدوياً من لوحة GitHub Secrets (لا يمكنني إنشاؤه عبر الـ API).
      - name: Restore google-services.json from secret
        run: |
          mkdir -p flutter_app/android/app
          echo "${{ secrets.FLUTTER_GOOGLE_SERVICES_JSON_BASE64 }}" | base64 -d > flutter_app/android/app/google-services.json

      # نفس مفتاح التوقيع المستخدم للنسخة السابقة (TWA) — سرّان موجودان
      # أصلاً في هذا المستودع (ANDROID_KEYSTORE_BASE64/PASSWORD)، يُعاد
      # استخدامهما هنا مباشرة، لا حاجة لأي سر جديد لهذه الخطوة.
      - name: Restore signing keystore from secret
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > flutter_app/android/app/literium.keystore

      - name: Generate the native android/ project (only if missing)
        working-directory: flutter_app
        run: |
          # نتحقق من settings.gradle تحديداً وليس مجرد وجود مجلد android/ —
          # مجلد android/app/ يكون موجوداً مسبقاً في هذه المرحلة لأن خطوة
          # استرجاع google-services.json أعلاه أنشأته عبر mkdir -p لوضع
          # الملفّين السرّيين فيه، فاختبار "-d android" وحده يعطي نتيجة
          # خاطئة (يظن المشروع موجوداً) ويتجاوز flutter create بالكامل.
          if [ ! -f "android/settings.gradle" ] && [ ! -f "android/settings.gradle.kts" ]; then
            flutter create --platforms=android --org=studio.ai.literium --project-name=literium_app .
          fi

      # منذ إصدارات Flutter الحديثة (٣.٤٧+ ضمن هذا السير) يولّد flutter create
      # مشروع Gradle بصيغة Kotlin DSL افتراضياً (settings.gradle.kts،
      # build.gradle.kts) بدل صيغة Groovy القديمة (.gradle) التي كتبت لها هذه
      # الخطوة أصلاً — فتُكتشف الصيغة الفعلية وقت التشغيل بدل افتراض واحدة.
      - name: Wire the Google Services Gradle plugin
        working-directory: flutter_app
        run: |
          python3 - <<'PY'
          import os

          settings_path = "android/settings.gradle.kts" if os.path.exists("android/settings.gradle.kts") else "android/settings.gradle"
          is_kts = settings_path.endswith(".kts")
          text = open(settings_path).read()
          if "com.google.gms.google-services" not in text:
              marker = 'id("com.android.application")' if is_kts else 'id "com.android.application"'
              insert = ('    id("com.google.gms.google-services") version "4.4.2" apply false\n'
                        if is_kts else
                        '    id "com.google.gms.google-services" version "4.4.2" apply false\n')
              idx = text.find(marker)
              if idx == -1:
                  raise SystemExit(f"لم يُعثر على كتلة plugins المتوقعة في {settings_path}")
              line_end = text.find("\n", idx) + 1
              text = text[:line_end] + insert + text[line_end:]
              open(settings_path, "w").write(text)

          app_gradle_path = "android/app/build.gradle.kts" if os.path.exists("android/app/build.gradle.kts") else "android/app/build.gradle"
          is_app_kts = app_gradle_path.endswith(".kts")
          text = open(app_gradle_path).read()
          if "com.google.gms.google-services" not in text:
              if is_app_kts:
                  idx = text.find("plugins {")
                  if idx == -1:
                      raise SystemExit(f"لم يُعثر على كتلة plugins في {app_gradle_path}")
                  line_end = text.find("\n", idx) + 1
                  text = text[:line_end] + '    id("com.google.gms.google-services")\n' + text[line_end:]
              else:
                  text += '\napply plugin: "com.google.gms.google-services"\n'
              open(app_gradle_path, "w").write(text)
          PY

      # مطلوب لـ firebase_crashlytics — نفس منطق كشف Kotlin DSL/Groovy وقت
      # التشغيل المستخدم في خطوة Google Services أعلاه بالضبط، لأن الحاجة
      # لهذا السجل ظهرت فقط بعد أن ثبت أن شاشة التشخيص في main.dart لا تظهر
      # إطلاقاً عند الانهيار الفوري — ما يعني عطلاً أصلياً قبل بدء Dart،
      # وCrashlytics هو الأداة الوحيدة القادرة على التقاط هذا النوع من
      # الأعطال بلا حاسوب/ADB لدى المستخدم.
      - name: Wire the Firebase Crashlytics Gradle plugin
        working-directory: flutter_app
        run: |
          python3 - <<'PY'
          import os

          settings_path = "android/settings.gradle.kts" if os.path.exists("android/settings.gradle.kts") else "android/settings.gradle"
          is_kts = settings_path.endswith(".kts")
          text = open(settings_path).read()
          if "com.google.firebase.crashlytics" not in text:
              marker = 'id("com.android.application")' if is_kts else 'id "com.android.application"'
              insert = ('    id("com.google.firebase.crashlytics") version "3.0.3" apply false\n'
                        if is_kts else
                        '    id "com.google.firebase.crashlytics" version "3.0.3" apply false\n')
              idx = text.find(marker)
              if idx == -1:
                  raise SystemExit(f"لم يُعثر على كتلة plugins المتوقعة في {settings_path}")
              line_end = text.find("\n", idx) + 1
              text = text[:line_end] + insert + text[line_end:]
              open(settings_path, "w").write(text)

          app_gradle_path = "android/app/build.gradle.kts" if os.path.exists("android/app/build.gradle.kts") else "android/app/build.gradle"
          is_app_kts = app_gradle_path.endswith(".kts")
          text = open(app_gradle_path).read()
          if "com.google.firebase.crashlytics" not in text:
              if is_app_kts:
                  idx = text.find("plugins {")
                  if idx == -1:
                      raise SystemExit(f"لم يُعثر على كتلة plugins في {app_gradle_path}")
                  line_end = text.find("\n", idx) + 1
                  text = text[:line_end] + '    id("com.google.firebase.crashlytics")\n' + text[line_end:]
              else:
                  text += '\napply plugin: "com.google.firebase.crashlytics"\n'
              open(app_gradle_path, "w").write(text)
          PY

      - name: Add release signing config
        working-directory: flutter_app
        run: |
          # applicationId ينتج بالفعل studio.ai.literium.literium_app من
          # خطوة `flutter create --org=... --project-name=...` أعلاه — لا
          # حاجة لتعديله هنا.
          #
          # ⚠️ minifyEnabled/shrinkResources مُفعَّلان هنا عمداً (لم يكونا
          # مفعّلين سابقاً): تطبيق فارغ بنفس أدوات البناء بالضبط فتح وعمل
          # بشكل طبيعي على جهاز المستخدم (37 ضغطة مستقرة)، بينما التطبيق
          # الحقيقي ينهار فوراً حتى بعد إزالة كل تهيئة Firebase/AdMob
          # التلقائية — وCrashlytics نفسه (المُدمَج فعلياً) لم يستقبل ولو
          # جلسة واحدة ناجحة، ما يعني أن العطل يحدث قبل أن يُتاح لأي كود —
          # حتى مزوّد Crashlytics الأصلي نفسه — فرصة التنفيذ. هذا يطابق
          # تماماً عطلاً كلاسيكياً في تحميل فئات DEX الأساسية عند عدم تفعيل
          # R8/الانكماش مع مكتبات ثقيلة متعددة (Firestore + Auth +
          # Crashlytics + AdMob + Google Sign-In) غير مُصغَّرة بالكامل.
          python3 - <<'PY'
          import os

          app_gradle_path = "android/app/build.gradle.kts" if os.path.exists("android/app/build.gradle.kts") else "android/app/build.gradle"
          is_kts = app_gradle_path.endswith(".kts")

          proguard_path = "android/app/proguard-rules.pro"
          if not os.path.exists(proguard_path):
              open(proguard_path, "w").write("# قواعد إضافية محلية إن احتاجها R8 لاحقاً — قواعد المستهلك المرفقة\n# مع كل مكتبة (Firebase/AdMob/...) تُطبَّق تلقائياً بلا حاجة لتكرارها هنا.\n")

          text = open(app_gradle_path).read()
          if "signingConfigs" not in text:
              if is_kts:
                  signing_block = '''
          android {
              signingConfigs {
                  create("release") {
                      storeFile = file("literium.keystore")
                      storePassword = System.getenv("KEYSTORE_PASSWORD")
                      keyAlias = "literium"
                      keyPassword = System.getenv("KEYSTORE_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig = signingConfigs.getByName("release")
                      isMinifyEnabled = true
                      isShrinkResources = true
                      proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")
                  }
              }
          }
          '''
              else:
                  signing_block = '''
          android {
              signingConfigs {
                  release {
                      storeFile file("literium.keystore")
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias "literium"
                      keyPassword System.getenv("KEYSTORE_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled true
                      shrinkResources true
                      proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
                  }
              }
          }
          '''
              text += signing_block
              open(app_gradle_path, "w").write(text)
          PY

      # كل المحاولات السابقة لتفعيل Built-in Kotlin أو حقن checker-qual كانت
      # في الاتجاه الخاطئ. السجل الحقيقي (تشغيل رقم 15) كشف السبب الفعلي بلا
      # أي لبس: cloud_firestore يطبّق 'kotlin-android' مباشرة (بلا أي شرط)،
      # وAGP 9+ يرفض ذلك بخطأ صريح: "The 'org.jetbrains.kotlin.android'
      # plugin is no longer required for Kotlin support since AGP 9.0" —
      # ويقترح Gradle نفسه الحل رسمياً في نص الخطأ: تعيين
      # android.builtInKotlin=false وandroid.newDsl=false معاً لتعطيل سلوك
      # AGP 9 الجديد والعودة لمسار الترجمة القديم الذي تعمل عليه كل حزم
      # FlutterFire فعلياً منذ شهور طويلة. هذا عكس ما فعلته الخطوة السابقة
      # تماماً (كانت تُفعّل true بدل false) — كانت مبنية على قراءة خاطئة
      # لتحذير غامض قبل أن يتوفر سجل الخطأ الصريح هذا.
      - name: Disable AGP 9 built-in Kotlin (official Gradle-suggested workaround)
        working-directory: flutter_app
        run: |
          python3 - <<'PY'
          import os, re

          path = "android/gradle.properties"
          text = open(path).read() if os.path.exists(path) else ""
          for key, value in (("android.builtInKotlin", "false"), ("android.newDsl", "false")):
              pattern = rf'^{re.escape(key)}=.*$'
              line = f'{key}={value}'
              if re.search(pattern, text, re.MULTILINE):
                  text = re.sub(pattern, line, text, flags=re.MULTILINE)
              else:
                  if text and not text.endswith("\n"):
                      text += "\n"
                  text += line + "\n"
          open(path, "w").write(text)
          PY

      - name: Add AdMob App ID to AndroidManifest.xml
        working-directory: flutter_app
        env:
          # App ID الحقيقي لتطبيق "Literium" في AdMob Console.
          ADMOB_APP_ID: "ca-app-pub-8136741145180538~7102233960"
        run: |
          python3 - <<PY
          import re
          path = "android/app/src/main/AndroidManifest.xml"
          text = open(path).read()
          if "com.google.android.gms.ads.APPLICATION_ID" not in text:
              meta = '        <meta-data\n            android:name="com.google.android.gms.ads.APPLICATION_ID"\n            android:value="${ADMOB_APP_ID}"/>\n'
              text = text.replace("</application>", meta + "    </application>")
              open(path, "w").write(text)
          PY

      # تراجع: خطوة "Disable Firebase/AdMob automatic native init" أُزيلت.
      # كانت مبنية على افتراض أن سبب الانهيار الفوري هو غياب خدمات Google
      # Play على جهاز المستخدم الأول (Redmi 10) — لكن الجهاز الثاني (الذي
      # يملك خدمات Google Play، بدليل نافذة "توقف" التي يعرضها Android نفسه
      # عند رصد انهيار حقيقي) ينهار بنفس الطريقة أيضاً، ما يُسقط ذلك
      # الافتراض. والأسوأ: إزالة FirebaseInitProvider مع إبقاء
      # CrashlyticsInitProvider (مزوّد Crashlytics الأصلي) فعّالاً قد يكون
      # سبب عطل جديد بحد ذاته — إذ يُحتمل أن يعتمد مزوّد Crashlytics على
      # وجود تطبيق Firebase افتراضي جاهز مسبقاً عبر FirebaseInitProvider،
      # وهو ما يفسّر أيضاً لماذا لم يصل ولو تقرير عطل واحد لـ Crashlytics
      # عبر جهازين ومحاولات عديدة. العودة للتهيئة التلقائية الافتراضية
      # (السلوك المُختبَر والموثّق فعلياً لملايين تطبيقات Firebase الأخرى)
      # أكثر أماناً من إبقاء تعديل غير مثبَت الفائدة.

      - name: flutter pub get
        working-directory: flutter_app
        run: flutter pub get

      - name: Build signed release APK
        working-directory: flutter_app
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: flutter build apk --release

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Literium-flutter-signed-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
