name: Bots Daily Publishing Cycle

# يشغّل دورة نشر/تفاعل بوتات الكتّاب الافتراضيين اليومية على الموقع الحي —
# مقال واحد وتغريدة واحدة (بالتداول بين 8 حسابات)، مع إعجابات وتعليقات
# تلقائية فيما بينها. الخادم (server.ts) هو من يقرر فعلياً ما إذا كانت
# الدورة تعمل أم لا (يتحقق من settings/publishingBots ومن عدم تكرار
# النشر لنفس اليوم) — هذا السير مجرد نبضة يومية تستدعيه، لا أكثر.
#
# ملاحظة: نفس درس سير health-check.yml — الجدولة عبر schedule: تعمل فقط
# من الفرع الافتراضي (main) في GitHub، فلا بد من دمج هذا الملف في main
# قبل أن تبدأ الجدولة تعمل فعلياً.

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

permissions:
  issues: write

jobs:
  run-daily-cycle:
    runs-on: ubuntu-latest
    steps:
      - name: POST /api/bots/run-daily-cycle
        id: call
        run: |
          # 280s: الدورة تستدعي Gemini تتابعياً حتى 4 مرات (مقال + تغريدة +
          # تعليقان)، وقد يتجاوز مجموعها 60 ثانية بسهولة — أثبت ذلك تشغيل
          # حقيقي فشل بخطأ "curl: (28) Operation timed out after 60002ms".
          status=$(curl -sS -o /tmp/body.txt -w "%{http_code}" --max-time 280 \
            -X POST \
            -H "x-bots-cron-secret: ${{ secrets.BOTS_CRON_SECRET }}" \
            https://literium-wjct.onrender.com/api/bots/run-daily-cycle || echo "000")
          echo "HTTP $status"
          cat /tmp/body.txt || true
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" != "200" ]; then
            echo "::error::فشل استدعاء دورة البوتات اليومية (HTTP $status)"
            exit 1
          fi

      # نفس مشكلة سجلات health-check.yml: سجلات تشغيل هذا السير غير قابلة
      # للقراءة أحياناً عبر أدوات فحص خارجية — فتح Issue بمحتوى الاستجابة
      # الفعلي هو الوسيلة الموثوقة الوحيدة لتشخيص أي فشل لاحقاً.
      - name: Ensure the bots-cycle-failed label exists
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh label create bots-cycle-failed --color B60205 --description "Bots daily publishing cycle call failed" --repo ${{ github.repository }} || true

      - name: Open or update the failure issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          body_content=$(cat /tmp/body.txt 2>/dev/null || echo "(لا يوجد جسم استجابة)")
          body="فشل استدعاء دورة البوتات اليومية عند $(date -u +"%Y-%m-%dT%H:%M:%SZ") UTC — HTTP ${{ steps.call.outputs.status }}.

\`\`\`
$body_content
\`\`\`"
          existing=$(gh issue list --repo ${{ github.repository }} --label bots-cycle-failed --state open --json number --jq '.[0].number' 2>/dev/null || echo "")
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo ${{ github.repository }} --body "$body"
          else
            gh issue create --repo ${{ github.repository }} --title "🤖 فشل دورة نشر البوتات اليومية" --label bots-cycle-failed --body "$body"
          fi

      - name: Close the failure issue once healthy again
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          existing=$(gh issue list --repo ${{ github.repository }} --label bots-cycle-failed --state open --json number --jq '.[0].number' 2>/dev/null || echo "")
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo ${{ github.repository }} --body "✅ نجح استدعاء دورة البوتات عند $(date -u +"%Y-%m-%dT%H:%M:%SZ") UTC — الاستجابة: \`$(cat /tmp/body.txt 2>/dev/null)\`"
            gh issue close "$existing" --repo ${{ github.repository }}
          fi
