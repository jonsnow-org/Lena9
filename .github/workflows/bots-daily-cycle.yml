name: Bots Daily Publishing Cycle

# يشغّل دورة نشر/تفاعل بوتات الكتّاب الافتراضيين اليومية على الموقع الحي —
# مقال واحد وتغريدة واحدة (بالتداول بين 8 حسابات)، مع إعجابات وتعليقات
# تلقائية فيما بينها. الخادم (server.ts) هو من يقرر فعلياً ما إذا كانت
# الدورة تعمل أم لا (يتحقق من settings/publishingBots ومن عدم تكرار
# النشر لنفس اليوم) — هذا السير مجرد نبضة يومية تستدعيه، لا أكثر.
#
# ملاحظة: نفس درس سير health-check.yml — الجدولة عبر schedule: تعمل فقط
# من الفرع الافتراضي (main) في GitHub، فلا بد من دمج هذا الملف في main
# قبل أن تبدأ الجدولة تعمل فعلياً.

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

permissions:
  issues: write

jobs:
  run-daily-cycle:
    runs-on: ubuntu-latest
    steps:
      - name: POST /api/bots/run-daily-cycle
        id: call
        run: |
          # 280s: الدورة تستدعي Gemini تتابعياً حتى 4 مرات (مقال + تغريدة +
          # تعليقان)، وقد يتجاوز مجموعها 60 ثانية بسهولة — أثبت ذلك تشغيل
          # حقيقي فشل بخطأ "curl: (28) Operation timed out after 60002ms".
          #
          # ⚠️ عمداً بلا exit 1 هنا حتى عند الفشل — أول محاولة لخطوات فتح/إغلاق
          # Issue التشخيصي أدناه استخدمت if: failure() بعد exit 1 في هذه
          # الخطوة، ولم تُنفَّذ فعلياً لسبب غير واضح (لا Issue ظهر رغم فشل حقيقي
          # مؤكَّد). القيمة الشرطية أدناه (نجاح/فشل عبر output لا حالة الخطوة
          # نفسها) هي بالضبط أسلوب health-check.yml المُثبَت عمله فعلياً.
          status=$(curl -sS -o /tmp/body.txt -w "%{http_code}" --max-time 280 \
            -X POST \
            -H "x-bots-cron-secret: ${{ secrets.BOTS_CRON_SECRET }}" \
            https://literium-wjct.onrender.com/api/bots/run-daily-cycle || echo "000")
          echo "HTTP $status"
          cat /tmp/body.txt || true
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Ensure the bots-cycle-failed label exists
        if: steps.call.outputs.status != '200'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh label create bots-cycle-failed --color B60205 --description "Bots daily publishing cycle call failed" --repo ${{ github.repository }} || true

      - name: Open or update the failure issue
        if: steps.call.outputs.status != '200'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "فشل استدعاء دورة البوتات اليومية عند $(date -u +"%Y-%m-%dT%H:%M:%SZ") UTC — HTTP ${{ steps.call.outputs.status }}."
            echo ""
            echo '```'
            cat /tmp/body.txt 2>/dev/null || echo "(لا يوجد جسم استجابة)"
            echo '```'
          } > /tmp/issue-body.md
          existing=$(gh issue list --repo ${{ github.repository }} --label bots-cycle-failed --state open --json number --jq '.[0].number' 2>/dev/null || echo "")
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo ${{ github.repository }} --body-file /tmp/issue-body.md
          else
            gh issue create --repo ${{ github.repository }} --title "🤖 فشل دورة نشر البوتات اليومية" --label bots-cycle-failed --body-file /tmp/issue-body.md
          fi

      - name: Close the failure issue once healthy again
        if: steps.call.outputs.status == '200'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          existing=$(gh issue list --repo ${{ github.repository }} --label bots-cycle-failed --state open --json number --jq '.[0].number' 2>/dev/null || echo "")
          if [ -n "$existing" ]; then
            {
              echo "✅ نجح استدعاء دورة البوتات عند $(date -u +"%Y-%m-%dT%H:%M:%SZ") UTC — الاستجابة:"
              echo ""
              echo '```'
              cat /tmp/body.txt 2>/dev/null || true
              echo '```'
            } > /tmp/issue-body.md
            gh issue comment "$existing" --repo ${{ github.repository }} --body-file /tmp/issue-body.md
            gh issue close "$existing" --repo ${{ github.repository }}
          fi

      - name: Fail the job if the call didn't return 200
        if: steps.call.outputs.status != '200'
        run: |
          echo "::error::فشل استدعاء دورة البوتات اليومية (HTTP ${{ steps.call.outputs.status }})"
          exit 1
