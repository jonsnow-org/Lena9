name: CI Verify

on:
  push:
    branches: [kilo/ivory-engine-kc6]
  schedule:
    - cron: '0 */6 * * *'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          cd onecore-ai
          python -m pip install -e .[dev]
      - name: Tests
        run: |
          cd onecore-ai
          python -m pytest -q
      - name: Synthetic training smoke
        run: |
          cd onecore-ai
          python -c "from onecore.synthetic_data import generate_text_samples; print(len(generate_text_samples(5)))"
      - name: Save report
        run: |
          mkdir -p reports
          echo "CI run complete" > reports/latest.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ci-report
          path: reports/