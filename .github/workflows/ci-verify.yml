name: CI Verify

on:
  push:
    branches: [kilo/ivory-engine-kc6]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          cd onecore-ai
          python -m pip install -e .[dev]
      - name: Tests
        run: |
          cd onecore-ai
          python -m pytest -q