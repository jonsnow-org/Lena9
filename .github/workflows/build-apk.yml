name: Build Android APK

# ⚠️ معطَّل عمداً (workflow_dispatch فقط) — مسار TWA هذا يُظهر دائماً إشعار
# نظام "قيد التشغيل في Chrome" الدائم بصرف النظر عن صحة إعداد Digital Asset
# Links (سلوك إلزامي من Google لكل جلسة Chrome Custom Tabs، وليس خللاً قابلاً
# للإصلاح بضبط أدق) — تأكَّد هذا فعلياً على جهاز حقيقي في 2026-09-09. المسار
# الصحيح الآن هو build-kotlin-apk.yml (MainActivity.kt فيه صار WebView أصيل
# مباشر، بلا Custom Tabs إطلاقاً). أُبقي على الكود والتشغيل اليدوي هنا فقط
# كمرجع، مطفأ عن push لمنع تكرار سباق الكتابة على نفس ملف التحميل.

on:
  workflow_dispatch:

permissions:
  contents: write

# منع تشغيلين متزامنين لنفس الفرع من التصادم مع بعضهما في خطوة الدفع
# الأخيرة (بالضبط ما حصل حين شُغِّل هذا السير عمل يدوياً و push في نفس
# اللحظة تقريباً: أحدهما نجح بالدفع والآخر فشل لأن الفرع تحرك تحته) —
# بدل تشغيلين متوازيين يتنافسان على نفس push، يُصفّان الآن، والتشغيل
# اللاحق لا يُلغى (queue بدل cancel) فيبني نسخته كاملة بدل أن يُفقد عمله.
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # bubblewrap يقرأ ~/.bubblewrap/config.json لمسار الـ JDK/SDK — بدون
      # هذا الملف يحاول تشغيل معالج تثبيت تفاعلي (يفشل حتماً في CI).
      - name: Configure Bubblewrap toolchain paths
        run: |
          mkdir -p ~/.bubblewrap
          cat > ~/.bubblewrap/config.json <<EOF
          {"jdkPath": "$JAVA_HOME", "androidSdkPath": "$ANDROID_HOME"}
          EOF

      - name: Install Bubblewrap
        run: |
          mkdir -p android-build
          cd android-build
          npm init -y
          npm install @bubblewrap/cli@1.25.0 @bubblewrap/core@1.25.0

      - name: Restore signing keystore from secret
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android-build/android.keystore

      - name: Print signing certificate SHA-256 (must match public/.well-known/assetlinks.json)
        # قيمة عامة غير حساسة (مصمَّمة لتُنشر علناً في assetlinks.json نفسه) —
        # طباعتها هنا آمنة تماماً ولا تكشف كلمة سر أو محتوى المفتاح.
        run: |
          keytool -list -v \
            -keystore android-build/android.keystore \
            -alias literium \
            -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            | grep "SHA256:"

      - name: Compute a version code guaranteed higher than any previous build
        # لا نستخدم github.run_number هنا: لهذا السير عمل عدّاده الخاص المنفصل
        # عن build-kotlin-apk.yml (كل ملف Workflow له عدّاد مستقل)، فقد يعطي
        # رقماً أقل من آخر نسخة كوتلين المنشورة فعلياً (كانت المشكلة الأصلية:
        # القيمة الافتراضية الثابتة 2 في twa-init.cjs). الدقائق منذ حقبة يونكس
        # تتزايد دوماً بغضّ النظر عن أي سير عمل بناها، وتبقى تحت حد أندرويد
        # الأقصى (2100000000) لعقود قادمة.
        id: version
        run: echo "code=$(( $(date -u +%s) / 60 ))" >> "$GITHUB_OUTPUT"

      - name: Scaffold TWA project from the live site's manifest
        # الملف يُنسخ داخل android-build عمداً قبل تشغيله: توزيع الحزم عبر
        # require() في Node يعتمد على مكان الملف نفسه لا مجلد العمل الحالي
        # (cwd)، فلو بقي بمكانه الأصلي تحت .github/scripts/ لن يجد
        # node_modules المُثبَّتة داخل android-build/ رغم أنها بجواره تقريباً.
        env:
          APP_VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          cp .github/scripts/twa-init.cjs android-build/twa-init.cjs
          cd android-build
          node twa-init.cjs

      - name: Build & sign APK
        working-directory: android-build
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: npx bubblewrap build

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Literium-signed-apk
          path: android-build/app-release-signed.apk
          if-no-files-found: error

      # يبقي زر "تحميل التطبيق" بالموقع (الذي يقدّم public/downloads/Literium.apk)
      # مطابقاً دائماً لآخر نسخة بُنيت هنا — بدونها يحصل بالضبط ما لاحظه
      # صاحب المشروع: نسخة GitHub Actions تختلف عن النسخة التي يحمّلها الزوار.
      - name: Publish built APK as the in-app download
        # concurrency group أعلاه يمنع تشغيلين من الدخول لهذه الخطوة معاً،
        # لكنها تبقى محمية بإعادة محاولة (rebase على أحدث main ثم إعادة
        # الدفع) لأي سباق نادر آخر يُحرّك الفرع بين الـ commit والـ push
        # (كأن يدفع أحدهم يدوياً بالتزامن) — بدل فشل الخطوة بالكامل.
        run: |
          cp android-build/app-release-signed.apk public/downloads/Literium.apk
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/downloads/Literium.apk
          if git diff --cached --quiet; then
            echo "No change in the built APK — skipping commit."
            exit 0
          fi
          git commit -m "Sync in-app download with latest CI-built APK [skip ci]"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:${{ github.ref_name }}; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt) — rebasing onto latest origin/${{ github.ref_name }} and retrying..."
            git fetch origin ${{ github.ref_name }}
            git rebase origin/${{ github.ref_name }}
            sleep 3
          done
          echo "::error::Failed to push the synced APK after 5 attempts."
          exit 1
