  evaluate:
    name: Independent validation, test and checkpoint report
    needs: train_10
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${${ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: onecore-ai/pyproject.toml
      - name: Install CPU-only PyTorch and dependencies
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --upgrade pip
          python -m pip install -e "onecore-ai[dev]"
      - name: Restore final corpus and final model checkpoint
        uses: actions/download-artifact@v4
        with:
          name: onecore-corpus-final
          path: onecore-ai/data
      - name: Restore the tenth session checkpoint
        uses: actions/download-artifact@v4
        with:
          name: onecore-state-train-10
          path: onecore-ai/run-state
      - name: Confirm 150 optimizer steps and five-family balance
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          report = json.loads(Path("onecore-ai/run-state/train_result.json").read_text(encoding="utf-8"))
          checkpoint = Path("onecore-ai/run-state/checkpoint.pt")
          digest = hashlib.sha256(checkpoint.read_bytes()).hexdigest()
          if int(report.get("optimizer_step", -1)) != 150:
              raise ValueError(f"Expected 150 optimizer steps; found {report.get('optimizer_step')}")
          if digest != report.get("checkpoint", {}).get("sha256"):
              raise ValueError("Checkpoint SHA-256 differs from train_result.json")
          expected = {"text": 150, "tool": 150, "image": 150, "audio": 150, "video": 150}
          observed = report.get("sampled_family_counts", {})
          if report.get("sampling_policy") != "one external sample from each of text/tool/image/audio/video per optimizer step":
              raise ValueError("Final report does not attest to five-family joint training")
          if any(int(observed.get(key, 0)) != value for key, value in expected.items()):
              raise ValueError(f"Unexpected family sample counts: {observed}")
          print(json.dumps({
              "optimizer_step": report["optimizer_step"],
              "checkpoint_sha256": digest,
              "lineage_id": report.get("lineage_id"),
              "sampled_family_counts": observed,
              "parameter_count": report.get("parameter_count"),
          }, ensure_ascii=False, indent=2))
          PY
      - name: Execute independent validation and held-out test
        shell: bash
        run: |
          mkdir -p onecore-ai/run-state/executed-notebooks
          jupyter nbconvert --to notebook --execute onecore-ai/notebooks/05_evaluation_and_promotion.ipynb \
            --output 05_evaluation_and_promotion.executed.ipynb \
            --output-dir onecore-ai/run-state/executed-notebooks \
            --ExecutePreprocessor.timeout=-1
      - name: Upload scientific evaluation results
        uses: actions/upload-artifact@v4
        with:
          name: onecore-evaluation-${${ github.run_id }}
          path: |
            onecore-ai/run-state/evaluation.json
            onecore-ai/run-state/evaluation.validation.json
            onecore-ai/run-state/evaluation.test.json
            onecore-ai/run-state/model-registry.json
            onecore-ai/run-state/train_result.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 1
      - name: Create durable versioned checkpoint release
        env:
          GH_TOKEN: ${${ github.token }}
        shell: bash
        run: |
          mkdir -p onecore-ai/run-state/release
          cp onecore-ai/run-state/checkpoint.pt onecore-ai/run-state/release/
          cp onecore-ai/run-state/tokenizer.json onecore-ai/run-state/release/
          cp onecore-ai/run-state/train_result.json onecore-ai/run-state/release/
          cp onecore-ai/run-state/evaluation.json onecore-ai/run-state/release/
          cp onecore-ai/run-state/evaluation.validation.json onecore-ai/run-state/release/
          cp onecore-ai/run-state/evaluation.test.json onecore-ai/run-state/release/
          (cd onecore-ai/run-state/release && zip -q -1 ../onecore-final-state.zip ./*)
          tag="onecore-run-${GITHUB_RUN_ID}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" onecore-ai/run-state/onecore-final-state.zip --clobber
          else
            gh release create "$tag" onecore-ai/run-state/onecore-final-state.zip \
              --title "OneCore final checkpoint — 150 optimizer steps" \
              --notes "OneCore initialized from random weights and trained in ten separate 15-step CPU jobs. Every optimizer update samples text, tool, image, audio and video. The checkpoint contains model, optimizer, scheduler, RNG and tokenizer state. Commit: ${GITHUB_SHA}." \
              --target "${GITHUB_SHA}"
          fi
      - name: Publish final training and evaluation summary
        if: always()
        shell: bash
        run: |
          echo "## OneCore alternating CPU training sessions" >> "$GITHUB_STEP_SUMMARY"
          echo "- Optimizer steps: 150" >> "$GITHUB_STEP_SUMMARY"
          echo "- Training jobs: 10 × 15 steps" >> "$GITHUB_STEP_SUMMARY"
          echo "- Notebook order: 03, 04, 03, 04, 03, 04, 03, 04, 03, 04" >> "$GITHUB_STEP_SUMMARY"
          echo "- Checkpoint release: onecore-run-${GITHUB_RUN_ID}" >> "$GITHUB_STEP_SUMMARY"
          [[ ! -f onecore-ai/run-state/train_result.json ]] || cat onecore-ai/run-state/train_result.json >> "$GITHUB_STEP_SUMMARY"
          [[ ! -f onecore-ai/run-state/evaluation.json ]] || cat onecore-ai/run-state/evaluation.json >> "$GITHUB_STEP_SUMMARY"
