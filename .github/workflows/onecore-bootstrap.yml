name: OneCore — initial GitHub training

on:
  push:
    branches:
      - research/onecore-foundation
    paths:
      - "onecore-ai/**"
      - ".github/workflows/onecore-bootstrap.yml"
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

concurrency:
  group: onecore-training
  cancel-in-progress: false

jobs:
  bootstrap-and-train:
    name: Initialize OneCore and train the first unified checkpoint
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      PYTHONPATH: onecore-ai/src
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout isolated OneCore branch
        uses: actions/checkout@v4
        with:
          ref: research/onecore-foundation

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: onecore-ai/pyproject.toml

      - name: Install CPU-only PyTorch and OneCore dependencies
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --upgrade pip
          python -m pip install -e "onecore-ai[dev]"

      - name: Generate reviewed-or-synthetic data without overwriting user data
        run: python -m onecore.bootstrap --root onecore-ai

      - name: Run the complete CI suite before training
        run: |
          python -m compileall -q onecore-ai/src
          pytest -q onecore-ai/tests

      - name: Execute contract, architecture and data gates
        run: |
          mkdir -p onecore-ai/run-state/executed-notebooks
          for notebook in 00_project_contract 01_architecture_budget 02_data_gate; do
            jupyter nbconvert --to notebook --execute "onecore-ai/notebooks/${notebook}.ipynb" \
              --output "${notebook}.executed.ipynb" \
              --output-dir onecore-ai/run-state/executed-notebooks \
              --ExecutePreprocessor.timeout=-1
          done

      - name: Train tokenizer and shared core on text and tool data
        env:
          ONECORE_STAGE: text
          ONECORE_STEPS: "5"
          ONECORE_RESUME: "false"
        run: |
          jupyter nbconvert --to notebook --execute onecore-ai/notebooks/03_text_pretraining.ipynb \
            --output 03_text_pretraining.executed.ipynb \
            --output-dir onecore-ai/run-state/executed-notebooks \
            --ExecutePreprocessor.timeout=-1

      - name: Initialize modality codebooks and continue the same model on image, audio, video and tools
        env:
          ONECORE_STAGE: multimodal
          ONECORE_STEPS: "5"
          ONECORE_RESUME: "true"
        run: |
          jupyter nbconvert --to notebook --execute onecore-ai/notebooks/04_multimodal_curriculum.ipynb \
            --output 04_multimodal_curriculum.executed.ipynb \
            --output-dir onecore-ai/run-state/executed-notebooks \
            --ExecutePreprocessor.timeout=-1

      - name: Evaluate every modality on the separate validation split
        run: |
          jupyter nbconvert --to notebook --execute onecore-ai/notebooks/05_evaluation_and_promotion.ipynb \
            --output 05_evaluation_and_promotion.executed.ipynb \
            --output-dir onecore-ai/run-state/executed-notebooks \
            --ExecutePreprocessor.timeout=-1

      - name: Upload first resumable checkpoint and reports
        if: ${{ always() && hashFiles('onecore-ai/run-state/checkpoint.pt') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: onecore-state-${{ github.run_id }}
          path: |
            onecore-ai/run-state/checkpoint.pt
            onecore-ai/run-state/tokenizer.json
            onecore-ai/run-state/train_result.json
            onecore-ai/run-state/evaluation.json
          if-no-files-found: warn
          retention-days: 90
          compression-level: 1

      - name: Retain the initial checkpoint in a versioned GitHub Release
        if: ${{ success() && hashFiles('onecore-ai/run-state/checkpoint.pt') != '' }}
        run: |
          mkdir -p onecore-ai/run-state/release
          cp onecore-ai/run-state/checkpoint.pt onecore-ai/run-state/release/
          cp onecore-ai/run-state/tokenizer.json onecore-ai/run-state/release/
          cp onecore-ai/run-state/train_result.json onecore-ai/run-state/release/
          cp onecore-ai/run-state/evaluation.json onecore-ai/run-state/release/
          (cd onecore-ai/run-state/release && zip -q -1 ../onecore-state.zip ./*)
          tag="onecore-run-${GITHUB_RUN_ID}"
          gh release create "$tag" onecore-ai/run-state/onecore-state.zip \
            --title "OneCore initial checkpoint — run ${GITHUB_RUN_ID}" \
            --notes "Initial synthetic-bootstrap training only. All model weights were random-init. This release is a resumable engineering checkpoint, not a general-knowledge model." \
            --target "${GITHUB_SHA}"

      - name: Publish run summary
        if: always()
        run: |
          {
            echo "## OneCore initial GitHub training"
            echo "- Run ID: ${GITHUB_RUN_ID}"
            echo "- Branch: research/onecore-foundation"
            echo "- Optimizer steps: 5 text/tool + 5 multimodal"
            echo "- Data kind: synthetic bootstrap unless reviewed manifests were present"
            echo "- Promotion: blocked until real reviewed corpus and approved quality thresholds"
            if [[ -f onecore-ai/run-state/train_result.json ]]; then cat onecore-ai/run-state/train_result.json; fi
            if [[ -f onecore-ai/run-state/evaluation.json ]]; then cat onecore-ai/run-state/evaluation.json; fi
          } >> "${GITHUB_STEP_SUMMARY}"
