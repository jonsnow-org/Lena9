        uses: actions/download-artifact@v7
        with:
          name: ${{ needs.prepare.outputs.base_corpus_artifact_name }}
          path: onecore-ai/run-state/corpus-artifact
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.prepare.outputs.base_corpus_run_id }}
      - name: Restore the exact completed checkpoint artifact
        uses: actions/download-artifact@v7
        with:
          name: ${{ needs.prepare.outputs.resume_checkpoint_artifact_name }}
          path: onecore-ai/run-state
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.prepare.outputs.resume_checkpoint_run_id }}
      - name: Restore corpus and verify checkpoint, optimizer, tokenizer and lineage
        shell: bash
        env:
          PYTHONPATH: onecore-ai/src
          EXPECTED_OPTIMIZER_STEP: ${{ needs.prepare.outputs.resume_optimizer_step }}
        run: |
          python -m onecore.artifacts restore --root onecore-ai --artifact-dir onecore-ai/run-state/corpus-artifact
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          import torch
          root = Path("onecore-ai/run-state")
          checkpoint = root / "checkpoint.pt"
          report = json.loads((root / "train_result.json").read_text(encoding="utf-8"))
          digest = hashlib.sha256(checkpoint.read_bytes()).hexdigest()
          if digest != report.get("checkpoint", {}).get("sha256"):
              raise ValueError("checkpoint SHA-256 differs from train_result.json")
          payload = torch.load(checkpoint, map_location="cpu", weights_only=False)
          expected = int(os.environ["EXPECTED_OPTIMIZER_STEP"])
          if int(payload.get("step", -1)) != expected or int(report.get("optimizer_step", -2)) != expected:
              raise ValueError("checkpoint and training report do not match the requested optimizer step")
          if not payload.get("optimizer", {}).get("state"):
              raise ValueError("checkpoint is missing optimizer moments")
          if not payload.get("scheduler"):
              raise ValueError("checkpoint is missing scheduler state")
          metadata = payload.get("metadata", {})
          classes = metadata.get("tokenizer_corpus_data_class_counts", {})
          if not classes or int(classes.get("external", 0)) <= 0 or any(
              key != "external" and int(value) > 0 for key, value in classes.items()
          ):
              raise ValueError(f"checkpoint tokenizer provenance is not external-only: {classes}")
          print(json.dumps({
              "optimizer_step": expected,
              "checkpoint_sha256": digest,
              "tokenizer_sha256": metadata.get("tokenizer_sha256"),
              "lineage_id": metadata.get("lineage_id"),
              "parent_checkpoint_sha256": metadata.get("parent_checkpoint_sha256"),
              "tokenizer_corpus_data_class_counts": classes,
          }, ensure_ascii=False, indent=2))
          PY
      - name: Recheck the restored corpus against the exact Spec v2 external data gate
        shell: bash
        env:
          PYTHONPATH: onecore-ai/src
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from onecore.acquire import assert_task_coverage, external_asset_report_by_split
          from onecore.config import load_config

          root = Path("onecore-ai")
          _, _, config = load_config(root / "configs" / "phone-research.yaml")
          gate = config.get("data_gate", {})
          required = set(gate.get("required_families", []))
          expected = {"text", "tool", "image", "audio", "video"}
          if required != expected:
              raise ValueError(f"Spec v2 requires exactly {sorted(expected)}; configured families are {sorted(required)}")
          minimum_train = int(gate.get("min_train_per_family", -1))
          minimum_holdout = int(gate.get("min_holdout_per_family", -1))
          if (minimum_train, minimum_holdout) != (100, 10):
              raise ValueError(
                  f"Spec v2 requires 100 train and 10 per validation/test family; "
                  f"configured values are {minimum_train}/{minimum_holdout}"
              )

          coverage = assert_task_coverage(
              root, required, minimum_train=100, minimum_holdout=10
          )
          assets = external_asset_report_by_split(root)
          report = {
              "gate": "PASS",
              "required_families": sorted(required),
              "minimums": {"train": 100, "validation": 10, "test": 10},
              "usable_external_task_coverage": coverage,
              "decoded_external_media": {
                  split: {
                      "records_by_task": value.get("records_by_task", {}),
                      "missing_asset_files": value.get("missing_asset_files"),
                      "unusable_external_records": value.get("unusable_external_records"),
                  }
                  for split, value in assets.items()
              },
          }
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY
      - name: Evaluate independent validation and held-out test with current code
        shell: bash
        env:
          PYTHONPATH: onecore-ai/src
          EXPECTED_OPTIMIZER_STEP: ${{ needs.prepare.outputs.resume_optimizer_step }}
          SOURCE_TRAINING_RUN_ID: ${{ needs.prepare.outputs.resume_checkpoint_run_id }}
          SOURCE_CHECKPOINT_ARTIFACT: ${{ needs.prepare.outputs.resume_checkpoint_artifact_name }}
          EVALUATION_CODE_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from onecore.checkpoint import write_json_atomic
          from onecore.evaluate import evaluate_checkpoint, promotion_gate
          root = Path("onecore-ai")
          config = root / "configs" / "phone-research.yaml"
          checkpoint = root / "run-state" / "checkpoint.pt"
          tokenizer = root / "run-state" / "tokenizer.json"
          thresholds = root / "configs" / "promotion-thresholds.json"
          validation = evaluate_checkpoint(
              root, config, checkpoint, tokenizer, thresholds,
              root / "run-state" / "evaluation.validation.json", split="validation", data_classes={"external"},
          )
          test = evaluate_checkpoint(
              root, config, checkpoint, tokenizer, thresholds,
              root / "run-state" / "evaluation.test.json", split="test", data_classes={"external"},
          )
          required = {"text_loss", "tool_use", "image_reconstruction", "audio_reconstruction", "video_sequence"}
          for label, result in (("validation", validation), ("test", test)):
              missing = required - set(result.get("modalities_tested", []))
              if missing:
                  raise ValueError(
                      f"{label} evaluation omitted required modalities: {sorted(missing)}; "
                      f"observed_per_task_counts={result.get('per_task_counts', {})}; "
                      f"observed_modalities={result.get('modalities_tested', [])}"
                  )
              native = result.get("native_tldm_evaluation") or {}
              family_counts = native.get("sample_counts_by_family") or {}
              if any(int(family_counts.get(family, 0)) < 10 for family in ("text", "tool", "image", "audio", "video")):
                  raise ValueError(f"{label} native T-LDM evaluation lacks ten examples per family: {family_counts}")
          if validation.get("checkpoint_sha256") != test.get("checkpoint_sha256"):
              raise ValueError("validation and test used different checkpoints")
          if validation.get("tokenizer_sha256") != test.get("tokenizer_sha256"):
              raise ValueError("validation and test used different tokenizers")
          if validation.get("split_manifest_sha256") == test.get("split_manifest_sha256"):
              raise ValueError("validation and test manifests are not independently fingerprinted")
          if int(validation.get("checkpoint_step", -1)) != int(os.environ["EXPECTED_OPTIMIZER_STEP"]):
              raise ValueError("evaluation checkpoint step differs from the requested lineage step")
          metrics = dict(validation)
          metrics["test_metrics"] = test
          metrics["test_manifest_sha256"] = test.get("split_manifest_sha256")
          metrics["test_split_independent"] = True
          metrics["evaluation_bundle_id"] = f"{validation['evaluation_id']}+{test['evaluation_id']}"
          metrics["evaluation_code_sha"] = os.environ["EVALUATION_CODE_SHA"]
          metrics["source_training_run_id"] = os.environ["SOURCE_TRAINING_RUN_ID"]
          metrics["source_checkpoint_artifact"] = os.environ["SOURCE_CHECKPOINT_ARTIFACT"]
          passed, failures = promotion_gate(metrics, baseline=None)
          metrics["promotion_gate_passed"] = passed
          metrics["promotion_gate_failures"] = failures
          metrics["promotion_status"] = "eligible" if passed else "blocked"
          write_json_atomic(root / "run-state" / "evaluation.json", metrics)
          print(json.dumps({
              "optimizer_step": metrics["checkpoint_step"],
              "checkpoint_sha256": metrics["checkpoint_sha256"],
              "tokenizer_sha256": metrics["tokenizer_sha256"],
              "validation_manifest_sha256": metrics["split_manifest_sha256"],
              "test_manifest_sha256": metrics["test_manifest_sha256"],
              "validation_modalities": validation["modalities_tested"],
              "test_modalities": test["modalities_tested"],
              "validation_tldm": validation["native_tldm_evaluation"],
              "test_tldm": test["native_tldm_evaluation"],
              "promotion_gate_passed": passed,
              "promotion_gate_failures": failures,
          }, ensure_ascii=False, indent=2))
          PY
      - name: Upload independent evaluation evidence
        uses: actions/upload-artifact@v6
        with:
          name: onecore-evaluation-recheck-${{ github.run_id }}
          path: |
            onecore-ai/run-state/evaluation.json
            onecore-ai/run-state/evaluation.validation.json
            onecore-ai/run-state/evaluation.test.json
            onecore-ai/run-state/train_result.json
            onecore-ai/run-state/acquisition-report.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 1
      - name: Publish evaluation-only summary
        if: always()
        shell: bash
        env:
          EXPECTED_OPTIMIZER_STEP: ${{ needs.prepare.outputs.resume_optimizer_step }}
        run: |
          echo "## OneCore independent evaluation-only run" >> "$GITHUB_STEP_SUMMARY"
          echo "- No optimizer updates were requested or executed." >> "$GITHUB_STEP_SUMMARY"
          echo "- Evaluated optimizer step: $EXPECTED_OPTIMIZER_STEP" >> "$GITHUB_STEP_SUMMARY"
          [[ ! -f onecore-ai/run-state/evaluation.json ]] || cat onecore-ai/run-state/evaluation.json >> "$GITHUB_STEP_SUMMARY"
