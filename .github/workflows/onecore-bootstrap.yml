      - id: train
        uses: ./.github/actions/onecore-train
        with:
          corpus_artifact_name: onecore-corpus-final
          checkpoint_artifact_name: "onecore-state-train-04"
          previous_checkpoint_artifact_name: "onecore-state-train-04"
          stage: "multimodal"
          notebook: "03_text_pretraining.ipynb"
          steps: "15"
          output_artifact_name: onecore-state-train-05

  train_06:
    name: Training session 6 of 10 — multimodal — 04_multimodal_curriculum.ipynb
    needs: train_05
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    outputs:
      optimizer_step: ${{ steps.train.outputs.optimizer_step }}
      checkpoint_sha256: ${{ steps.train.outputs.checkpoint_sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - id: train
        uses: ./.github/actions/onecore-train
        with:
          corpus_artifact_name: onecore-corpus-final
          checkpoint_artifact_name: "onecore-state-train-05"
          previous_checkpoint_artifact_name: "onecore-state-train-05"
          stage: "multimodal"
          notebook: "04_multimodal_curriculum.ipynb"
          steps: "15"
          output_artifact_name: onecore-state-train-06

  train_07:
