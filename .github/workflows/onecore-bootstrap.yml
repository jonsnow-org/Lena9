          checkpoint_artifact_name: "onecore-state-train-02"
          previous_checkpoint_artifact_name: "onecore-state-train-02"
          stage: "multimodal"
          notebook: "03_text_pretraining.ipynb"
          steps: "15"
          output_artifact_name: onecore-state-train-03

  train_04:
    name: Training session 4 of 10 — multimodal — 04_multimodal_curriculum.ipynb
    needs: train_03
