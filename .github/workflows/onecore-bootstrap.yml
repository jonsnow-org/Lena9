name: OneCore — bounded acquisition and alternating CPU training

on:
  push:
    branches: [research/onecore-foundation]
    paths: ["onecore-ai/training-request.json"]

permissions:
  contents: write
  actions: write

concurrency:
  group: onecore-training
  cancel-in-progress: false

env:
  HF_TOKEN: ${${ secrets.HF_TOKEN }}

jobs:
  prepare:
    name: Validate code and training contract
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      base_corpus_run_id: ${${ steps.request.outputs.base_corpus_run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${${ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: onecore-ai/pyproject.toml
      - name: Install CPU-only PyTorch and dependencies
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --upgrade pip
          python -m pip install -e "onecore-ai[dev]"
      - name: Validate the all-data from-scratch request
        id: request
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, re
          from pathlib import Path
          request = json.loads(Path("onecore-ai/training-request.json").read_text(encoding="utf-8"))
          if request.get("stage") != "acquire" or request.get("start_fresh_joint_training") is not True:
              raise ValueError("The initial run must acquire all data and initialize OneCore from random weights")
          if int(request.get("steps", 0)) != 150:
              raise ValueError("This staged workflow is configured for exactly 150 optimizer steps")
          corpus = str(request.get("base_corpus_run_id", "")).strip()
          if not re.fullmatch(r"[0-9]+", corpus):
              raise ValueError("A preserved base corpus artifact run ID is required")
          print(f"base_corpus_run_id={corpus}")
          PY
      - name: Compile package and run all tests
        run: |
          python -m compileall -q onecore-ai/src
          pytest -q onecore-ai/tests
      - name: Validate and compile every notebook
        run: |
          python - <<'PY'
          from pathlib import Path
          import nbformat
          notebooks = sorted(Path("onecore-ai/notebooks").glob("*.ipynb"))
          assert len(notebooks) == 6, f"Expected six notebooks, found {len(notebooks)}"
          for path in notebooks:
              notebook = nbformat.read(path, as_version=4)
              nbformat.validate(notebook)
              for index, cell in enumerate(notebook.cells):
                  if cell.cell_type == "code":
                      compile(cell.source, f"{path}:cell-{index}", "exec")
              print(f"VALID + PYTHON-COMPILED {path}")
          PY
      - name: Execute project contract and architecture notebooks
        shell: bash
        run: |
          mkdir -p onecore-ai/run-state/executed-notebooks
          for notebook in 00_project_contract 01_architecture_budget; do
            jupyter nbconvert --to notebook --execute "onecore-ai/notebooks/${notebook}.ipynb" \
              --output "${notebook}.executed.ipynb" \
              --output-dir onecore-ai/run-state/executed-notebooks \
              --ExecutePreprocessor.timeout=-1
          done

  acquire_1:
    name: Acquisition session 1 of 6
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    outputs:
      complete: ${${ steps.session.outputs.complete }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${${ github.sha }}
      - id: session
        uses: ./.github/actions/onecore-acquire
        with:
          prior_artifact_name: onecore-corpus-${${ needs.prepare.outputs.base_corpus_run_id }}
          prior_run_id: ${${ needs.prepare.outputs.base_corpus_run_id }}
          output_artifact_name: onecore-corpus-acq-1
          budget_seconds: "9000"
          session_label: "01"

  acquire_2:
    name: Acquisition session 2 of 6
    needs: acquire_1
    if: ${{ needs.acquire_1.outputs.complete != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    outputs:
      complete: ${{ steps.session.outputs.complete }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - id: session
        uses: ./.github/actions/onecore-acquire
        with:
          prior_artifact_name: onecore-corpus-acq-1
          prior_run_id: ${{ github.run_id }}
          output_artifact_name: onecore-corpus-acq-2
          budget_seconds: "9000"
          session_label: "02"

  acquire_3:
    name: Acquisition session 3 of 6
    needs: acquire_2
    if: ${{ needs.acquire_2.outputs.complete != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    outputs:
      complete: ${{ steps.session.outputs.complete }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - id: session
        uses: ./.github/actions/onecore-acquire
        with:
          prior_artifact_name: onecore-corpus-acq-2
          prior_run_id: ${{ github.run_id }}
          output_artifact_name: onecore-corpus-acq-3
          budget_seconds: "9000"
          session_label: "03"

  acquire_4:
    name: Acquisition session 4 of 6
    needs: acquire_3
    if: ${{ needs.acquire_3.outputs.complete != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    outputs:
      complete: ${{ steps.session.outputs.complete }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - id: session
        uses: ./.github/actions/onecore-acquire
        with:
          prior_artifact_name: onecore-corpus-acq-3
          prior_run_id: ${{ github.run_id }}
          output_artifact_name: onecore-corpus-acq-4
          budget_seconds: "9000"
          session_label: "04"

  acquire_5:
    name: Acquisition session 5 of 6
    needs: acquire_4
    if: ${{ needs.acquire_4.outputs.complete != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    outputs:
      complete: ${{ steps.session.outputs.complete }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - id: session
        uses: ./.github/actions/onecore-acquire
        with:
          prior_artifact_name: onecore-corpus-acq-4
          prior_run_id: ${{ github.run_id }}
          output_artifact_name: onecore-corpus-acq-5
          budget_seconds: "9000"
          session_label: "05"

  acquire_6:
    name: Acquisition session 6 of 6
    needs: acquire_5
    if: ${{ needs.acquire_5.outputs.complete != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    outputs:
      complete: ${{ steps.session.outputs.complete }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - id: session
        uses: ./.github/actions/onecore-acquire
        with:
          prior_artifact_name: onecore-corpus-acq-5
          prior_run_id: ${{ github.run_id }}
          output_artifact_name: onecore-corpus-acq-6
          budget_seconds: "9000"
          session_label: "06"

  finalize_acquisition:
    name: Select the latest complete corpus snapshot
    needs: [acquire_1, acquire_2, acquire_3, acquire_4, acquire_5, acquire_6]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      artifact_name: ${${ steps.select.outputs.artifact_name }}
    steps:
      - name: Select newest successful complete acquisition artifact
        id: select
        shell: bash
        env:
          A1_COMPLETE: ${${ needs.acquire_1.outputs.complete }}
          A1_RESULT: ${${ needs.acquire_1.result }}
          A2_COMPLETE: ${${ needs.acquire_2.outputs.complete }}
          A2_RESULT: ${${ needs.acquire_2.result }}
          A3_COMPLETE: ${${ needs.acquire_3.outputs.complete }}
          A3_RESULT: ${${ needs.acquire_3.result }}
          A4_COMPLETE: ${${ needs.acquire_4.outputs.complete }}
          A4_RESULT: ${${ needs.acquire_4.result }}
          A5_COMPLETE: ${${ needs.acquire_5.outputs.complete }}
          A5_RESULT: ${${ needs.acquire_5.result }}
          A6_COMPLETE: ${${ needs.acquire_6.outputs.complete }}
          A6_RESULT: ${${ needs.acquire_6.result }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          for index in range(6, 0, -1):
              if os.environ.get(f"A{index}_RESULT") == "success" and os.environ.get(f"A{index}_COMPLETE") == "true":
                  print(f"artifact_name=onecore-corpus-acq-{index}")
                  raise SystemExit(0)
          raise SystemExit("The six bounded acquisition sessions did not complete all enabled sources; resume from the latest uploaded corpus.")
          PY

  dataset_gate:
    name: Final multimodal coverage and split-integrity gate
    needs: finalize_acquisition
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${${ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: onecore-ai/pyproject.toml
      - name: Install CPU-only PyTorch and dependencies
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --upgrade pip
          python -m pip install -e "onecore-ai[dev]"
      - name: Restore the latest complete acquisition snapshot
        uses: actions/download-artifact@v4
        with:
          name: ${${ needs.finalize_acquisition.outputs.artifact_name }}
          path: onecore-ai/data
      - name: Require all enabled sources to be terminal
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("onecore-ai/data/acquisition-report.json").read_text(encoding="utf-8"))
          if not report.get("acquisition_complete") or report.get("pending_sources"):
              raise ValueError(f"Acquisition is not complete: {report.get('pending_sources')}")
          print(json.dumps({
              "completed_sources": report.get("completed_sources"),
              "source_count": report.get("source_count"),
              "total_new_records": report.get("total_new_records"),
          }, ensure_ascii=False, indent=2))
          PY
      - name: Execute full modality and independent-split data gate
        shell: bash
        env:
          PYTHONPATH: onecore-ai/src
          ONECORE_SKIP_ACQUISITION: "1"
          ONECORE_FINALIZE_DATA_GATE: "1"
          ONECORE_REQUIRED_TASKS: "text,tool,image,audio,video"
          ONECORE_MIN_TRAIN_RECORDS: "25"
          ONECORE_MIN_HOLDOUT_RECORDS: "5"
        run: |
          mkdir -p onecore-ai/run-state/executed-notebooks
          jupyter nbconvert --to notebook --execute onecore-ai/notebooks/02_data_gate.ipynb \
            --output 02_data_gate.final.executed.ipynb \
            --output-dir onecore-ai/run-state/executed-notebooks \
            --ExecutePreprocessor.timeout=-1
      - name: Upload complete validated corpus and resume state
        uses: actions/upload-artifact@v4
        with:
          name: onecore-corpus-final
          path: |
            onecore-ai/data/train.jsonl
            onecore-ai/data/validation.jsonl
            onecore-ai/data/test.jsonl
            onecore-ai/data/acquisition-report.json
            onecore-ai/data/assets/
            onecore-ai/data/metadata/
            onecore-ai/data/pending/
            onecore-ai/data/resume-cache/
          if-no-files-found: error
          retention-days: 90
          compression-level: 1
      - name: Remove intermediate corpus after validated replacement is uploaded
        shell: bash
        env:
          GH_TOKEN: ${${ github.token }}
          SOURCE_ARTIFACT: ${${ needs.finalize_acquisition.outputs.artifact_name }}
        run: |
          previous_id=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" \
            --paginate --jq '.artifacts[] | select(.name == "'"$SOURCE_ARTIFACT"'") | .id' | head -1)
          if [[ -n "$previous_id" ]]; then
            gh api -X DELETE "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${previous_id}"
          fi

  train_01:
    name: Training session 1 of 10 — joint — 03_text_pretraining.ipynb
    needs: dataset_gate
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    outputs:
      optimizer_step: ${{ steps.train.outputs.optimizer_step }}
      checkpoint_sha256: ${{ steps.train.outputs.checkpoint_sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - id: train
        uses: ./.github/actions/onecore-train
        with:
          corpus_artifact_name: onecore-corpus-final
          checkpoint_artifact_name: ""
          previous_checkpoint_artifact_name: ""
          stage: "joint"
          notebook: "03_text_pretraining.ipynb"
          steps: "15"
          output_artifact_name: onecore-state-train-01

