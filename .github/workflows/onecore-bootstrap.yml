name: OneCore — staged GitHub training

on:
  push:
    branches: [research/onecore-foundation]
    paths:
      - "onecore-ai/training-request.json"

permissions:
  contents: write
  actions: write

concurrency:
  group: onecore-training
  cancel-in-progress: false

jobs:
  train:
    name: OneCore staged segment
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      PYTHONPATH: onecore-ai/src
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: onecore-ai/pyproject.toml

      - name: Install CPU-only PyTorch and OneCore dependencies
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --upgrade pip
          python -m pip install -e "onecore-ai[dev]"

      - name: Read and validate the immutable training request
        id: request
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, re
          from pathlib import Path
          request = json.loads(Path("onecore-ai/training-request.json").read_text(encoding="utf-8"))
          stage = str(request.get("stage", ""))
          steps = int(request.get("steps", 0))
          resume_run_id = str(request.get("resume_run_id", "")).strip()
          parent_run_id = str(request.get("parent_run_id", resume_run_id)).strip()
          data_run_id = str(request.get("data_run_id", "")).strip()
          if stage not in {"acquire", "text", "multimodal", "evaluate"}:
              raise ValueError("stage must be acquire, text, multimodal, or evaluate")
          if not 1 <= steps <= 250:
              raise ValueError("steps must be an integer from 1 to 250")
          if stage in {"multimodal", "evaluate"} and not resume_run_id:
              raise ValueError(f"{stage} requires a previous resumable checkpoint run ID")
          if stage != "acquire" and not data_run_id:
              raise ValueError("text/multimodal/evaluate require an imported onecore-corpus artifact data_run_id")
          if data_run_id and not re.fullmatch(r"[0-9]+", data_run_id):
              raise ValueError("data_run_id must contain digits only")
          if resume_run_id and not re.fullmatch(r"[0-9]+", resume_run_id):
              raise ValueError("resume_run_id must contain digits only")
          if parent_run_id and not re.fullmatch(r"[0-9]+", parent_run_id):
              raise ValueError("parent_run_id must contain digits only")
          if resume_run_id and parent_run_id != resume_run_id:
              raise ValueError("parent_run_id must match resume_run_id for exact checkpoint ancestry")
          print(f"stage={stage}")
          print(f"steps={steps}")
          print(f"resume_run_id={resume_run_id}")
          print(f"parent_run_id={parent_run_id}")
          print(f"data_run_id={data_run_id}")
          PY

      - name: Generate deterministic bootstrap data or validate existing reviewed manifests
        run: python -m onecore.bootstrap --root onecore-ai

      - name: Restore imported shared corpus for text and multimodal continuation
        if: ${{ steps.request.outputs.data_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: onecore-corpus-${{ steps.request.outputs.data_run_id }}
          run-id: ${{ steps.request.outputs.data_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: onecore-ai/data

      - name: Restore previous checkpoint artifact
        if: ${{ steps.request.outputs.resume_run_id != '' }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: onecore-state-${{ steps.request.outputs.resume_run_id }}
          run-id: ${{ steps.request.outputs.resume_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: onecore-ai/run-state

      - name: Restore durable GitHub Release checkpoint if artifact is unavailable
        if: ${{ steps.request.outputs.resume_run_id != '' }}
        shell: bash
        run: |
          mkdir -p onecore-ai/run-state
          if [[ ! -s onecore-ai/run-state/checkpoint.pt ]]; then
            tag="onecore-run-${{ steps.request.outputs.resume_run_id }}"
            gh release download "$tag" --pattern onecore-state.zip --dir onecore-ai/run-state
            unzip -o onecore-ai/run-state/onecore-state.zip -d onecore-ai/run-state
          fi
          test -s onecore-ai/run-state/checkpoint.pt
          test -s onecore-ai/run-state/tokenizer.json

      - name: Verify restored checkpoint, optimizer, lineage and prior reports
        if: ${{ steps.request.outputs.resume_run_id != '' }}
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          import torch
          from onecore.config import ModelConfig
          from onecore.model import OneCore
          root = Path("onecore-ai/run-state")
          checkpoint = root / "checkpoint.pt"
          report_path = root / "train_result.json"
          evaluation_path = root / "evaluation.json"
          if not report_path.is_file():
              raise FileNotFoundError("resumed checkpoint artifact lacks train_result.json")
          report = json.loads(report_path.read_text(encoding="utf-8"))
          digest_builder = hashlib.sha256()
          with checkpoint.open("rb") as stream:
              for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                  digest_builder.update(chunk)
          digest = digest_builder.hexdigest()
          expected_digest = report.get("checkpoint", {}).get("sha256")
          if not expected_digest or digest != expected_digest:
              raise ValueError(f"checkpoint SHA-256 mismatch: expected {expected_digest}, got {digest}")
          payload = torch.load(checkpoint, map_location="cpu", weights_only=False)
          if int(payload.get("step", -1)) != int(report.get("optimizer_step", -2)):
              raise ValueError("checkpoint optimizer step differs from train_result.json")
          optimizer_state = payload.get("optimizer", {}).get("state", {})
          if int(payload.get("step", 0)) > 0 and not optimizer_state:
              raise ValueError("checkpoint has a positive optimizer step but no optimizer state")
          scheduler_state = payload.get("scheduler") or {}
          metadata = payload.get("metadata", {})
          if metadata.get("scheduler_step") is not None and scheduler_state.get("last_epoch") != metadata.get("scheduler_step"):
              raise ValueError("scheduler state does not match checkpoint metadata")
          raw_model_config = payload.get("config", {}).get("model", {})
          allowed = set(ModelConfig.__dataclass_fields__)
          model_config = ModelConfig.from_mapping({k: v for k, v in raw_model_config.items() if k in allowed})
          model = OneCore(model_config)
          actual_parameters = model.count_parameters()
          if actual_parameters != int(report.get("parameter_count", -1)):
              raise ValueError(f"parameter count mismatch: model={actual_parameters}, report={report.get('parameter_count')}")
          print(json.dumps({
              "restored_checkpoint_sha256": digest,
              "checkpoint_bytes": checkpoint.stat().st_size,
              "optimizer_step": payload["step"],
              "optimizer_state_parameter_entries": len(optimizer_state),
              "scheduler_last_epoch": scheduler_state.get("last_epoch"),
              "trainable_parameter_count": actual_parameters,
              "metadata": {k: metadata.get(k) for k in ("stage", "real_data", "data_kind", "seed", "manifest_sha256", "asset_manifest_sha256", "tokenizer_sha256", "codebooks_initialized", "codebook_report", "lineage_id", "parent_checkpoint_sha256", "parent_run_id")},
              "previous_train_result": report,
              "previous_evaluation": json.loads(evaluation_path.read_text(encoding="utf-8")) if evaluation_path.is_file() else None,
              "model_registry": "present" if (root / "model-registry.json").is_file() else "absent; no promotion recorded",
          }, ensure_ascii=False, indent=2))
          PY

      - name: Run complete OneCore CI suite before training
        shell: bash
        run: |
          python -m compileall -q onecore-ai/src
          pytest -q onecore-ai/tests
          python - <<'PY'
          from pathlib import Path
          import nbformat
          notebooks = sorted(Path("onecore-ai/notebooks").glob("*.ipynb"))
          assert len(notebooks) == 6, f"Expected exactly six ordered notebooks, found {len(notebooks)}"
          for path in notebooks:
              nbformat.validate(nbformat.read(path, as_version=4))
              print(f"VALID {path}")
          for name in ("onecore-training.yml", "onecore-bootstrap.yml"):
              text = (Path(".github/workflows") / name).read_text(encoding="utf-8")
              assert "group: onecore-training" in text
              assert "research/onecore-foundation" in text
          print("OneCore CI, notebook integrity, isolation and serialization checks passed.")
          PY
      - name: Execute contract, architecture and verified external-corpus gate
        env:
          ONECORE_SKIP_ACQUISITION: ${{ steps.request.outputs.data_run_id != '' && '1' || '0' }}
          ONECORE_REQUIRED_TASKS: text,tool,image,audio,video
          ONECORE_MIN_TRAIN_RECORDS: '25'
          ONECORE_MIN_HOLDOUT_RECORDS: '5'
        run: |
          mkdir -p onecore-ai/run-state/executed-notebooks
          for notebook in 00_project_contract 01_architecture_budget 02_data_gate; do
            jupyter nbconvert --to notebook --execute "onecore-ai/notebooks/${notebook}.ipynb" \
              --output "${notebook}.executed.ipynb" \
              --output-dir onecore-ai/run-state/executed-notebooks \
              --ExecutePreprocessor.timeout=-1
          done

      - name: Upload acquired shared corpus
        if: ${{ success() && steps.request.outputs.stage == 'acquire' }}
        uses: actions/upload-artifact@v4
        with:
          name: onecore-corpus-${{ github.run_id }}
          path: |
            onecore-ai/data/train.jsonl
            onecore-ai/data/validation.jsonl
            onecore-ai/data/test.jsonl
            onecore-ai/data/acquisition-report.json
            onecore-ai/data/assets/
            onecore-ai/data/metadata/
          if-no-files-found: error
          retention-days: 90
          compression-level: 1

      - name: Start fresh random-initialized OneCore text training on the imported corpus
        if: ${{ success() && steps.request.outputs.stage == 'acquire' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh workflow run onecore-training.yml --ref research/onecore-foundation \
            -f stage=text -f steps=150 -f data_run_id=${GITHUB_RUN_ID}

      - name: Execute smoke or text/tool foundation segment
        if: ${{ steps.request.outputs.stage == 'text' }}
        env:
          ONECORE_STAGE: text
          ONECORE_STEPS: ${{ steps.request.outputs.steps }}
          ONECORE_RESUME: ${{ steps.request.outputs.resume_run_id != '' }}
          ONECORE_PARENT_RUN_ID: ${{ steps.request.outputs.parent_run_id }}
        run: |
          jupyter nbconvert --to notebook --execute onecore-ai/notebooks/03_text_pretraining.ipynb \
            --output 03_text_pretraining.executed.ipynb \
            --output-dir onecore-ai/run-state/executed-notebooks \
            --ExecutePreprocessor.timeout=-1

      - name: Execute joint multimodal curriculum segment
        if: ${{ steps.request.outputs.stage == 'multimodal' }}
        env:
          ONECORE_STAGE: multimodal
          ONECORE_STEPS: ${{ steps.request.outputs.steps }}
          ONECORE_RESUME: true
          ONECORE_PARENT_RUN_ID: ${{ steps.request.outputs.parent_run_id }}
        run: |
          jupyter nbconvert --to notebook --execute onecore-ai/notebooks/04_multimodal_curriculum.ipynb \
            --output 04_multimodal_curriculum.executed.ipynb \
            --output-dir onecore-ai/run-state/executed-notebooks \
            --ExecutePreprocessor.timeout=-1

      - name: Execute held-out evaluation and promotion gate
        if: ${{ always() && steps.request.outputs.stage != '' && steps.request.outputs.stage != 'acquire' && hashFiles('onecore-ai/run-state/checkpoint.pt') != '' }}
        run: |
          jupyter nbconvert --to notebook --execute onecore-ai/notebooks/05_evaluation_and_promotion.ipynb \
            --output 05_evaluation_and_promotion.executed.ipynb \
            --output-dir onecore-ai/run-state/executed-notebooks \
            --ExecutePreprocessor.timeout=-1

      - name: Preserve source revisions and parent data fingerprint for resume
        if: ${{ always() && hashFiles('onecore-ai/data/acquisition-report.json') != '' }}
        run: cp onecore-ai/data/acquisition-report.json onecore-ai/run-state/acquisition-report.json

      - name: Upload resumable checkpoint and scientific reports
        if: ${{ always() && hashFiles('onecore-ai/run-state/checkpoint.pt') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: onecore-state-${{ github.run_id }}
          path: |
            onecore-ai/run-state/checkpoint.pt
            onecore-ai/run-state/tokenizer.json
            onecore-ai/run-state/train_result.json
            onecore-ai/run-state/evaluation.json
            onecore-ai/run-state/evaluation.validation.json
            onecore-ai/run-state/evaluation.test.json
            onecore-ai/run-state/model-registry.json
            onecore-ai/run-state/acquisition-report.json
          if-no-files-found: warn
          retention-days: 90
          compression-level: 1

      - name: Check durable release write token
        id: release_auth
        if: ${{ success() && steps.request.outputs.stage != 'evaluate' && hashFiles('onecore-ai/run-state/checkpoint.pt') != '' }}
        env:
          ONECORE_RELEASE_TOKEN: ${{ secrets.ONECORE_RELEASE_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ -n "${ONECORE_RELEASE_TOKEN}" || -n "${GH_TOKEN}" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Create durable versioned GitHub Release checkpoint
        id: release
        if: ${{ success() && steps.request.outputs.stage != 'evaluate' && steps.release_auth.outputs.enabled == 'true' && hashFiles('onecore-ai/run-state/checkpoint.pt') != '' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.ONECORE_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          mkdir -p onecore-ai/run-state/release
          cp onecore-ai/run-state/checkpoint.pt onecore-ai/run-state/release/
          [[ ! -f onecore-ai/run-state/tokenizer.json ]] || cp onecore-ai/run-state/tokenizer.json onecore-ai/run-state/release/
          [[ ! -f onecore-ai/run-state/train_result.json ]] || cp onecore-ai/run-state/train_result.json onecore-ai/run-state/release/
          [[ ! -f onecore-ai/run-state/evaluation.json ]] || cp onecore-ai/run-state/evaluation.json onecore-ai/run-state/release/
          [[ ! -f onecore-ai/run-state/evaluation.validation.json ]] || cp onecore-ai/run-state/evaluation.validation.json onecore-ai/run-state/release/
          [[ ! -f onecore-ai/run-state/evaluation.test.json ]] || cp onecore-ai/run-state/evaluation.test.json onecore-ai/run-state/release/
          [[ ! -f onecore-ai/run-state/model-registry.json ]] || cp onecore-ai/run-state/model-registry.json onecore-ai/run-state/release/
          [[ ! -f onecore-ai/run-state/acquisition-report.json ]] || cp onecore-ai/run-state/acquisition-report.json onecore-ai/run-state/release/
          (cd onecore-ai/run-state/release && zip -q -1 ../onecore-state.zip ./*)
          tag="onecore-run-${GITHUB_RUN_ID}"
          notes="OneCore from-scratch checkpoint. Parent run: ${{ steps.request.outputs.parent_run_id }}; stage: ${{ steps.request.outputs.stage }}. This checkpoint continues one unified model and includes resumable optimizer/scheduler/RNG state. Synthetic bootstrap data remains non-promotion-eligible."
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" onecore-ai/run-state/onecore-state.zip --clobber
          else
            gh release create "$tag" onecore-ai/run-state/onecore-state.zip \
              --title "OneCore ${{ steps.request.outputs.stage }} checkpoint — run ${GITHUB_RUN_ID}" \
              --notes "$notes" \
              --target "${GITHUB_SHA}"
          fi

      - name: Publish verifiable training and evaluation results
        if: always()
        shell: bash
        run: |
          echo "## OneCore staged training run" >> "$GITHUB_STEP_SUMMARY"
          echo "- Stage: ${{ steps.request.outputs.stage }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Requested optimizer steps: ${{ steps.request.outputs.steps }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Parent run ID: ${{ steps.request.outputs.parent_run_id }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Run ID: ${GITHUB_RUN_ID}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Branch: research/onecore-foundation" >> "$GITHUB_STEP_SUMMARY"
          echo "- Checkpoint release: onecore-run-${GITHUB_RUN_ID}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Durable release token configured: ${{ steps.release_auth.outputs.enabled }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Durable release step outcome: ${{ steps.release.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          if [[ -f onecore-ai/run-state/train_result.json ]]; then
            echo '### Training report' | tee -a "$GITHUB_STEP_SUMMARY"
            cat onecore-ai/run-state/train_result.json | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          if [[ -f onecore-ai/run-state/evaluation.json ]]; then
            echo '### Evaluation report' | tee -a "$GITHUB_STEP_SUMMARY"
            cat onecore-ai/run-state/evaluation.json | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          if [[ -f onecore-ai/data/acquisition-report.json ]]; then
            echo '### Dataset acquisition report' | tee -a "$GITHUB_STEP_SUMMARY"
            cat onecore-ai/data/acquisition-report.json | tee -a "$GITHUB_STEP_SUMMARY"
          fi
