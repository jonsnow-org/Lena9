        with:
          ref: ${{ github.sha }}
      - id: train
        uses: ./.github/actions/onecore-train
        with:
          corpus_artifact_name: onecore-corpus-final
          checkpoint_artifact_name: "onecore-state-train-01"
          previous_checkpoint_artifact_name: "onecore-state-train-01"
          stage: "multimodal"
          notebook: "04_multimodal_curriculum.ipynb"
          steps: "15"
          output_artifact_name: onecore-state-train-02

  train_03:
    name: Training session 3 of 10 — multimodal — 03_text_pretraining.ipynb
    needs: train_02
