name: OneCore bounded acquisition session
description: Restore the latest corpus, acquire for a bounded CPU window, and preserve all resumable data.

inputs:
  prior_artifact_name:
    description: Previous corpus artifact name
    required: true
  prior_run_id:
    description: Workflow run containing the previous corpus artifact
    required: true
  output_artifact_name:
    description: New corpus artifact name
    required: true
  budget_seconds:
    description: Maximum active acquisition window for this runner session
    required: false
    default: "10800"
  session_label:
    description: Human-readable acquisition session label
    required: true
  stack_v2_aws_access_key_id:
    description: Software Heritage/INRIA approved AWS access key for Stack v2 content
    required: false
  stack_v2_aws_secret_access_key:
    description: Software Heritage/INRIA approved AWS secret for Stack v2 content
    required: false
  stack_v2_aws_session_token:
    description: Optional temporary AWS session token for Stack v2 content
    required: false
  stack_v2_aws_region:
    description: S3 region used for the Software Heritage content bucket
    required: false
    default: us-east-1

outputs:
  complete:
    description: Whether every enabled source reached a terminal acquisition state
    value: ${{ steps.report.outputs.complete }}
  pending_sources:
    description: Number of enabled sources that still need acquisition
    value: ${{ steps.report.outputs.pending_sources }}

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.11"
        cache: pip
        cache-dependency-path: onecore-ai/pyproject.toml

    - name: Install CPU-only PyTorch and acquisition dependencies
      shell: bash
      run: |
        python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
        python -m pip install --upgrade pip
        python -m pip install -e "onecore-ai[dev]"

    - name: Restore the previous corpus and all resume caches
      uses: actions/download-artifact@v7
      with:
        name: ${{ inputs.prior_artifact_name }}
        run-id: ${{ inputs.prior_run_id }}
        github-token: ${{ github.token }}
        path: onecore-ai/run-state/corpus-artifact

    - name: Restore the previous corpus snapshot (tar or legacy layout)
      shell: bash
      env:
        PYTHONPATH: onecore-ai/src
      run: python -m onecore.artifacts restore --root onecore-ai --artifact-dir onecore-ai/run-state/corpus-artifact

    - name: Ensure deterministic bootstrap records are present without replacing the restored corpus
      shell: bash
      env:
        PYTHONPATH: onecore-ai/src
      run: python -m onecore.bootstrap --root onecore-ai

    - name: Execute one bounded acquisition session in each owning notebook
      shell: bash
      env:
        PYTHONPATH: onecore-ai/src
        HF_TOKEN: ${{ env.HF_TOKEN }}
        STACK_V2_AWS_ACCESS_KEY_ID: ${{ inputs.stack_v2_aws_access_key_id }}
        STACK_V2_AWS_SECRET_ACCESS_KEY: ${{ inputs.stack_v2_aws_secret_access_key }}
        STACK_V2_AWS_SESSION_TOKEN: ${{ inputs.stack_v2_aws_session_token }}
        STACK_V2_AWS_REGION: ${{ inputs.stack_v2_aws_region }}
        ONECORE_FINALIZE_DATA_GATE: "0"
        ONECORE_REQUIRED_TASKS: "text,tool,image,audio,video"
        ONECORE_DATA_PROFILE: "expanded"
        ONECORE_MIN_TRAIN_RECORDS: "25"
        ONECORE_MIN_HOLDOUT_RECORDS: "5"
      run: |
        echo "Acquisition session: ${{ inputs.session_label }}"
        total_budget="${{ inputs.budget_seconds }}"
        notebook_budget=0
        source_budget=150
        if [[ "$total_budget" =~ ^[0-9]+$ ]] && (( total_budget > 0 )); then
          notebook_budget=$((total_budget / 2))
          (( notebook_budget > 0 )) || notebook_budget=1
        fi
        echo "Each notebook receives ${notebook_budget}s; each source receives up to ${source_budget}s per session."
        ONECORE_ACQUIRE_ONLY=1 ONECORE_ACQUIRE_BUDGET_SECONDS="$notebook_budget" ONECORE_ACQUIRE_SOURCE_BUDGET_SECONDS="$source_budget" \
          jupyter nbconvert --to notebook --execute onecore-ai/notebooks/03_text_pretraining.ipynb \
            --output "03_text_pretraining.${{ inputs.session_label }}.acquisition.ipynb" \
            --output-dir onecore-ai/run-state/executed-notebooks \
            --ExecutePreprocessor.timeout=-1
        ONECORE_ACQUIRE_ONLY=1 ONECORE_ACQUIRE_BUDGET_SECONDS="$notebook_budget" ONECORE_ACQUIRE_SOURCE_BUDGET_SECONDS="$source_budget" \
          jupyter nbconvert --to notebook --execute onecore-ai/notebooks/04_multimodal_curriculum.ipynb \
            --output "04_multimodal_curriculum.${{ inputs.session_label }}.acquisition.ipynb" \
            --output-dir onecore-ai/run-state/executed-notebooks \
            --ExecutePreprocessor.timeout=-1
        ONECORE_SKIP_ACQUISITION=1 ONECORE_ACQUIRE_ONLY=0 \
          jupyter nbconvert --to notebook --execute onecore-ai/notebooks/02_data_gate.ipynb \
            --output "02_data_gate.${{ inputs.session_label }}.executed.ipynb" \
            --output-dir onecore-ai/run-state/executed-notebooks \
            --ExecutePreprocessor.timeout=-1

    - name: Persist exact source offsets and pending rows with the corpus
      shell: bash
      env:
        PYTHONPATH: onecore-ai/src
      run: |
        python - <<'PY'
        from onecore.acquire import persist_acquisition_progress
        print(persist_acquisition_progress("onecore-ai"))
        PY

    - name: Package the corpus and resume state as one stack-safe archive
      shell: bash
      env:
        PYTHONPATH: onecore-ai/src
      run: |
        python -m onecore.artifacts pack --root onecore-ai --output "$RUNNER_TEMP/onecore-corpus.tar"
        test -s "$RUNNER_TEMP/onecore-corpus.tar"

    - name: Read acquisition completion state
      id: report
      shell: bash
      run: |
        python - <<'PY' >> "$GITHUB_OUTPUT"
        import json
        from pathlib import Path
        report = json.loads(Path("onecore-ai/data/acquisition-report.json").read_text(encoding="utf-8"))
        pending = report.get("pending_sources", [])
        complete = bool(report.get("acquisition_complete", False))
        print(f"complete={str(complete).lower()}")
        print(f"pending_sources={len(pending)}")
        print(f"completed_sources={report.get('completed_sources', 0)}")
        print(f"total_sources={report.get('source_count', 0)}")
        print(f"new_records={report.get('total_new_records', 0)}")
        PY

    - name: Publish per-notebook crawler progress
      shell: bash
      env:
        PYTHONPATH: onecore-ai/src
        SESSION_LABEL: ${{ inputs.session_label }}
      run: |
        python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
        import json
        import os
        from pathlib import Path
        from onecore.crawlers import notebook_cursor_summary
        report = json.loads(Path("onecore-ai/data/acquisition-report.json").read_text(encoding="utf-8"))
        print("### OneCore streaming crawler checkpoint")
        print()
        print("- Session: " + os.environ.get("SESSION_LABEL", "unknown"))
        print(f"- Acquisition complete: **{report.get('acquisition_complete', False)}**")
        print(f"- Pending sources: **{len(report.get('pending_sources', []))}**")
        print(f"- Sources requiring access: **{report.get('sources_with_access_required', 0)}**")
        print()
        print("| Notebook | Source | Status | Raw rows scanned (this session) | Usable records in corpus | New accepted now | Cursor mode |")
        print("|---|---|---:|---:|---:|---:|---|")
        for item in report.get("sources", []):
            cursors = item.get("crawler_cursors", {}) or {}
            modes = ",".join(sorted({str(v.get("mode", "saved")) for v in cursors.values() if isinstance(v, dict)}))
            new_counts = item.get("new_accepted_by_output_split", {}) or {}
            new_accepted = sum(int(value) for value in new_counts.values())
            print(f"| {item.get('crawler_notebook', '—')} | {item.get('source', '—')} | {item.get('status', '—')} | {item.get('total_read', item.get('read', 0))} | {item.get('total_accepted', item.get('accepted', 0))} | {new_accepted} | {modes or 'not started'} |")
        print()
        for notebook in ("03_text_pretraining", "04_multimodal_curriculum"):
            summary = notebook_cursor_summary("onecore-ai", notebook)
            accepted = sum(
                int(item.get("total_accepted", item.get("accepted", 0)))
                for item in report.get("sources", [])
                if item.get("crawler_notebook") == notebook
            )
            new_accepted = sum(
                int(value)
                for item in report.get("sources", [])
                if item.get("crawler_notebook") == notebook
                for value in (item.get("new_accepted_by_output_split", {}) or {}).values()
            )
            print(f"**{notebook}:** {summary.get('cursor_files', 0)} cursors; {accepted} usable corpus records; {new_accepted} newly accepted in its latest pass")
        PY

    - name: Upload the updated corpus and resume state as a single file
      uses: actions/upload-artifact@v6
      with:
        name: ${{ inputs.output_artifact_name }}
        path: ${{ runner.temp }}/onecore-corpus.tar
        if-no-files-found: error
        retention-days: 90
        compression-level: 0

    - name: Remove superseded in-workflow corpus artifact after the replacement is uploaded
      if: ${{ inputs.prior_run_id == github.run_id && inputs.prior_artifact_name != inputs.output_artifact_name }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        previous_id=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" \
          --paginate --jq '.artifacts[] | select(.name == "${{ inputs.prior_artifact_name }}") | .id' | head -1)
        if [[ -n "$previous_id" ]]; then
          gh api -X DELETE "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${previous_id}"
          echo "Removed superseded corpus artifact ${{ inputs.prior_artifact_name }}"
        fi
