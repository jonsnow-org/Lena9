name: OneCore sequential bounded acquisition
description: Restore the corpus once, run bounded resumable acquisition sessions on one CPU runner, and preserve one durable snapshot.

inputs:
  prior_artifact_name:
    description: Previous corpus artifact name
    required: true
  prior_run_id:
    description: Workflow run containing the previous corpus artifact
    required: true
  output_artifact_name:
    description: New corpus artifact name
    required: true
  session_count:
    description: Maximum bounded acquisition sessions to run sequentially
    required: false
    default: "6"
  budget_seconds:
    description: Active acquisition window for each session, split evenly between text and multimodal notebooks
    required: false
    default: "540"
  source_budget_seconds:
    description: Maximum time slice for one source within each notebook
    required: false
    default: "60"
  required_tasks:
    description: External task families required before joint training starts
    required: false
    default: "text,tool,image,audio,video"
  min_train_records:
    description: Minimum usable external records per task family in train
    required: false
    default: "100"
  min_holdout_records:
    description: Minimum usable external records per task family in validation and test
    required: false
    default: "10"
  stack_v2_aws_access_key_id:
    description: Software Heritage/INRIA approved AWS access key for Stack v2 content
    required: false
  stack_v2_aws_secret_access_key:
    description: Software Heritage/INRIA approved AWS secret for Stack v2 content
    required: false
  stack_v2_aws_session_token:
    description: Optional temporary AWS session token for Stack v2 content
    required: false
  stack_v2_aws_region:
    description: S3 region used for the Software Heritage content bucket
    required: false
    default: us-east-1

outputs:
  complete:
    description: Whether the five-family external payload gate is met
    value: \${{ steps.session.outputs.complete }}
  acquisition_complete:
    description: Whether every enabled source quota reached a terminal state
    value: \${{ steps.session.outputs.acquisition_complete }}
  pending_sources:
    description: Number of enabled sources that still need acquisition
    value: \${{ steps.session.outputs.pending_sources }}
  sessions_completed:
    description: Number of bounded sessions completed on this runner
    value: \${{ steps.session.outputs.sessions_completed }}
  acquisition_error:
    description: Whether a notebook or acquisition step failed before the last checkpoint
    value: \${{ steps.session.outputs.acquisition_error }}

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.11"
        cache: pip
        cache-dependency-path: onecore-ai/pyproject.toml

    - name: Install CPU-only PyTorch and acquisition dependencies
      shell: bash
      run: |
        python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
        python -m pip install --upgrade pip
        python -m pip install -e "onecore-ai[dev]"

    - name: Restore the previous corpus and all resume caches
      uses: actions/download-artifact@v7
      with:
        name: \${{ inputs.prior_artifact_name }}
        run-id: \${{ inputs.prior_run_id }}
        github-token: \${{ github.token }}
        path: onecore-ai/run-state/corpus-artifact

    - name: Restore the previous corpus snapshot (tar or legacy layout)
      shell: bash
      env:
        PYTHONPATH: onecore-ai/src
      run: python -m onecore.artifacts restore --root onecore-ai --artifact-dir onecore-ai/run-state/corpus-artifact

    - name: Ensure deterministic bootstrap records are present without replacing the restored corpus
      shell: bash
      env:
        PYTHONPATH: onecore-ai/src
      run: python -m onecore.bootstrap --root onecore-ai

    - name: Execute sequential bounded acquisition sessions
      id: session
      shell: bash
      env:
        PYTHONPATH: onecore-ai/src
        HF_TOKEN: \${{ env.HF_TOKEN }}
        STACK_V2_AWS_ACCESS_KEY_ID: \${{ inputs.stack_v2_aws_access_key_id }}
        STACK_V2_AWS_SECRET_ACCESS_KEY: \${{ inputs.stack_v2_aws_secret_access_key }}
        STACK_V2_AWS_SESSION_TOKEN: \${{ inputs.stack_v2_aws_session_token }}
        STACK_V2_AWS_REGION: \${{ inputs.stack_v2_aws_region }}
        SESSION_COUNT: \${{ inputs.session_count }}
        TOTAL_BUDGET_SECONDS: \${{ inputs.budget_seconds }}
        SOURCE_BUDGET_SECONDS: \${{ inputs.source_budget_seconds }}
        REQUIRED_TASKS: \${{ inputs.required_tasks }}
        MIN_TRAIN_RECORDS: \${{ inputs.min_train_records }}
        MIN_HOLDOUT_RECORDS: \${{ inputs.min_holdout_records }}
      run: |
        set -uo pipefail
        if ! [[ "$SESSION_COUNT" =~ ^[0-9]+$ ]] || (( SESSION_COUNT < 1 || SESSION_COUNT > 6 )); then
          echo "::error::session_count must be between 1 and 6."
          exit 1
        fi
        if ! [[ "$TOTAL_BUDGET_SECONDS" =~ ^[0-9]+$ ]] || (( TOTAL_BUDGET_SECONDS < 120 )); then
          echo "::error::budget_seconds must be at least 120."
          exit 1
        fi
        if ! [[ "$SOURCE_BUDGET_SECONDS" =~ ^[0-9]+$ ]] || (( SOURCE_BUDGET_SECONDS < 60 || SOURCE_BUDGET_SECONDS > 120 )); then
          echo "::error::source_budget_seconds must be between 60 and 120."
          exit 1
        fi

        notebook_budget=$((TOTAL_BUDGET_SECONDS / 2))
        sessions_completed=0
        training_ready=false
        acquisition_complete=false
        acquisition_error=false

        for ((session_index=1; session_index<=SESSION_COUNT; session_index++)); do
          session_label=$(printf "%02d" "$session_index")
          echo "## OneCore acquisition session $session_label/$SESSION_COUNT"
          echo "Each owning notebook receives $notebook_budget seconds; each source receives up to $SOURCE_BUDGET_SECONDS seconds."

          ONECORE_ACQUIRE_ONLY=1 ONECORE_DATA_PROFILE=expanded \
          ONECORE_ACQUIRE_BUDGET_SECONDS="$notebook_budget" \
          ONECORE_ACQUIRE_SOURCE_BUDGET_SECONDS="$SOURCE_BUDGET_SECONDS" \
            jupyter nbconvert --to notebook --execute onecore-ai/notebooks/03_text_pretraining.ipynb \
              --output "03_text_pretraining.$session_label.acquisition.ipynb" \
              --output-dir onecore-ai/run-state/executed-notebooks \
              --ExecutePreprocessor.timeout=-1
          text_status=$?
          if (( text_status != 0 )); then
            echo "::warning::Text/code acquisition notebook failed in session $session_label; preserving the last committed cursor and corpus."
            acquisition_error=true
            break
          fi

          ONECORE_ACQUIRE_ONLY=1 ONECORE_DATA_PROFILE=expanded \
          ONECORE_ACQUIRE_BUDGET_SECONDS="$notebook_budget" \
          ONECORE_ACQUIRE_SOURCE_BUDGET_SECONDS="$SOURCE_BUDGET_SECONDS" \
            jupyter nbconvert --to notebook --execute onecore-ai/notebooks/04_multimodal_curriculum.ipynb \
              --output "04_multimodal_curriculum.$session_label.acquisition.ipynb" \
              --output-dir onecore-ai/run-state/executed-notebooks \
              --ExecutePreprocessor.timeout=-1
          media_status=$?
          if (( media_status != 0 )); then
            echo "::warning::Multimodal acquisition notebook failed in session $session_label; preserving the last committed cursor and corpus."
            acquisition_error=true
            break
          fi

          export SESSION_LABEL="$session_label"
          export COMPLETED_SESSIONS="$session_index"
          PYTHONPATH=onecore-ai/src python - <<'PY'
        import json
        import os
        from pathlib import Path
        from onecore.acquire import assert_task_coverage

        root = Path("onecore-ai")
        report_path = root / "data" / "acquisition-report.json"
        report = json.loads(report_path.read_text(encoding="utf-8"))
        required = {
            value.strip()
            for value in os.environ["REQUIRED_TASKS"].split(",")
            if value.strip()
        }
        ready = False
        coverage = {}
        failures = []
        try:
            coverage = assert_task_coverage(
                root,
                required,
                minimum_train=int(os.environ["MIN_TRAIN_RECORDS"]),
                minimum_holdout=int(os.environ["MIN_HOLDOUT_RECORDS"]),
            )
            ready = True
        except RuntimeError as exc:
            failures = [line.strip() for line in str(exc).split(";") if line.strip()]

        report["training_ready"] = ready
        report["training_ready_task_groups"] = sorted(required) if ready else []
        report["training_ready_coverage"] = coverage
        report["training_ready_failures"] = failures
        report["last_acquisition_session"] = os.environ["SESSION_LABEL"]
        report["completed_acquisition_sessions"] = int(os.environ["COMPLETED_SESSIONS"])
        temporary = report_path.with_suffix(".json.tmp")
        temporary.write_text(
            json.dumps(report, ensure_ascii=False, indent=2),
            encoding="utf-8",
        )
        os.replace(temporary, report_path)
        print(json.dumps({
            "training_ready": ready,
            "coverage": coverage,
            "failures": failures,
            "acquisition_complete": bool(report.get("acquisition_complete", False)),
            "pending_sources": len(report.get("pending_sources", [])),
            "total_new_records": report.get("total_new_records", 0),
        }, ensure_ascii=False, indent=2))
        PY
          coverage_status=$?
          if (( coverage_status != 0 )); then
            echo "::warning::The five-family coverage check failed unexpectedly in session $session_label; preserving the corpus for diagnosis."
            acquisition_error=true
            break
          fi

          sessions_completed=$session_index
          training_ready=$(python -c 'import json; print(str(bool(json.load(open("onecore-ai/data/acquisition-report.json", encoding="utf-8")).get("training_ready", False))).lower())')
          acquisition_complete=$(python -c 'import json; print(str(bool(json.load(open("onecore-ai/data/acquisition-report.json", encoding="utf-8")).get("acquisition_complete", False))).lower())')
          echo "Session $session_label saved. training_ready=$training_ready; acquisition_complete=$acquisition_complete"

          PYTHONPATH=onecore-ai/src python -c 'from onecore.acquire import persist_acquisition_progress; print(persist_acquisition_progress("onecore-ai"))'
          persist_status=$?
          if (( persist_status != 0 )); then
            echo "::warning::Cursor progress ledger could not be refreshed after session $session_label."
            acquisition_error=true
            break
          fi

          if [[ "$training_ready" == "true" ]]; then
            echo "Five-family data coverage is met; stopping acquisition and moving to full validation."
            break
          fi
          if [[ "$acquisition_complete" == "true" ]]; then
            echo "All enabled source quotas are terminal; no additional acquisition sessions are needed."
            break
          fi
        done

        PYTHONPATH=onecore-ai/src python -c 'from onecore.acquire import persist_acquisition_progress; print(persist_acquisition_progress("onecore-ai"))'
        persist_status=$?
        if (( persist_status != 0 )); then
          echo "::warning::Final progress-ledger refresh failed."
          acquisition_error=true
        fi

        report_path="onecore-ai/data/acquisition-report.json"
        if [[ -f "$report_path" ]]; then
          training_ready=$(python -c 'import json; print(str(bool(json.load(open("onecore-ai/data/acquisition-report.json", encoding="utf-8")).get("training_ready", False))).lower())')
          acquisition_complete=$(python -c 'import json; print(str(bool(json.load(open("onecore-ai/data/acquisition-report.json", encoding="utf-8")).get("acquisition_complete", False))).lower())')
          pending_sources=$(python -c 'import json; print(len(json.load(open("onecore-ai/data/acquisition-report.json", encoding="utf-8")).get("pending_sources", [])))')
        else
          training_ready=false
          acquisition_complete=false
          pending_sources=0
          acquisition_error=true
          echo "::error::The restored corpus has no acquisition report."
        fi

        {
          echo "complete=$training_ready"
          echo "acquisition_complete=$acquisition_complete"
          echo "pending_sources=$pending_sources"
          echo "sessions_completed=$sessions_completed"
          echo "acquisition_error=$acquisition_error"
        } >> "$GITHUB_OUTPUT"

        {
          echo "## OneCore acquisition checkpoint"
          echo "- Bounded sessions completed: $sessions_completed/$SESSION_COUNT"
          echo "- Five-family training readiness: **$training_ready**"
          echo "- All enabled source quotas terminal: **$acquisition_complete**"
          echo "- Pending source cursors: **$pending_sources**"
          echo "- Acquisition error recorded: **$acquisition_error**"
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Publish source and cursor progress
      if: always()
      shell: bash
      env:
        PYTHONPATH: onecore-ai/src
      run: |
        python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
        import json
        from pathlib import Path
        path = Path("onecore-ai/data/acquisition-report.json")
        if not path.is_file():
            print("No restored acquisition report is available.")
            raise SystemExit(0)
        report = json.loads(path.read_text(encoding="utf-8"))
        print()
        print("| Source | Status | Usable corpus records | Newly accepted | Cursor mode |")
        print("|---|---:|---:|---:|---|")
        for item in report.get("sources", []):
            cursors = item.get("crawler_cursors", {}) or {}
            modes = ",".join(sorted({
                str(value.get("mode", "saved"))
                for value in cursors.values()
                if isinstance(value, dict)
            }))
            newly_accepted = sum(
                int(value)
                for value in (item.get("new_accepted_by_output_split", {}) or {}).values()
            )
            print(
                f"| {item.get('source', '—')} | {item.get('status', '—')} | "
                f"{item.get('total_accepted', item.get('accepted', 0))} | "
                f"{newly_accepted} | {modes or 'not started'} |"
            )
        PY

    - name: Package the latest corpus and resume state
      id: package
      if: always()
      shell: bash
      env:
        PYTHONPATH: onecore-ai/src
      run: |
        test -s onecore-ai/data/train.jsonl
        test -s onecore-ai/data/validation.jsonl
        test -s onecore-ai/data/test.jsonl
        test -s onecore-ai/data/acquisition-report.json
        python -m onecore.artifacts pack --root onecore-ai --output "$RUNNER_TEMP/onecore-corpus.tar"
        test -s "$RUNNER_TEMP/onecore-corpus.tar"
        du -h "$RUNNER_TEMP/onecore-corpus.tar"

    - name: Upload one cumulative corpus snapshot
      if: always() && steps.package.outcome == 'success'
      uses: actions/upload-artifact@v6
      with:
        name: \${{ inputs.output_artifact_name }}
        path: \${{ runner.temp }}/onecore-corpus.tar
        if-no-files-found: error
        retention-days: 90
        compression-level: 0
